<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Entrevistas | Punto 506 - Historias de Pococí</title>
    <meta name="description" content="Conoce las historias de éxito, retos y el lado humano de los comerciantes del Cantón de Pococí. Entrevistas exclusivas de Punto 506.">
    <meta name="keywords" content="Pococí, Guápiles, Entrevistas, Comercio Local, Punto 506, Negocios Limón, Emprendedores Costa Rica">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0a0908">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://punto506.montzucr.com/entrevistas">
    <meta property="og:title" content="Historias de Pococí | Punto 506">
    <meta property="og:description" content="Descubre el rostro detrás del comercio local en Guápiles y alrededores.">
    <meta property="og:image" content="https://punto506.montzucr.com/img/og-preview.webp">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Historias de Pococí | Punto 506">
    <meta property="twitter:description" content="Entrevistas exclusivas con el comercio de la zona atlántica.">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Historias de Pococí",
      "description": "Serie de video-entrevistas a comerciantes y emprendedores del Cantón de Pococí.",
      "url": "https://punto506.montzucr.com/entrevistas",
      "publisher": {
        "@type": "Organization",
        "name": "Punto 506",
        "logo": {
          "@type": "ImageObject",
          "url": "https://punto506.montzucr.com/favicon.svg"
        }
      }
    }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        .serif-title { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.15em; }
        body { background: #0a0908; color: #d1d5db; }

        .bg-pattern {
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(212, 163, 115, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .text-gradient {
            background: linear-gradient(to right, #fef3c7, #d4a373, #b45309);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .video-card {
            background: rgba(18, 16, 15, 0.8);
            border-left: 3px solid rgba(212, 163, 115, 0.1);
            transition: all 0.4s ease;
        }

        .video-card:hover {
            border-left-color: #d4a373;
            background: rgba(28, 25, 23, 1);
            transform: translateY(-4px);
        }

        .pococi-badge {
            background: linear-gradient(90deg, #d4a373 0%, #bc8a5f 100%);
            color: #000;
            font-weight: 900;
            padding: 2px 10px;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
        }

        .iso-emblem {
            border: 2px solid #d4a373;
            transition: all 0.3s ease;
        }
        .iso-emblem:hover {
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="font-['Inter'] antialiased p-4 md:p-8">

    <div class="bg-pattern"></div>

    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-12 border-b border-white/5 pb-8">
        <div class="flex items-center gap-6">
            <a href="/" class="flex flex-col items-center gap-2 group">
                <div class="w-14 h-14 iso-emblem rounded-full flex items-center justify-center bg-black/40">
                    <span class="serif-title text-xl text-[#d4a373] font-bold">506</span>
                </div>
            </a>
            <div>
                <h1 class="serif-title text-3xl md:text-4xl font-bold text-gradient">Historias de Pococí</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="pococi-badge text-[8px] uppercase tracking-tighter">Cantón de Pococí</span>
                    <p class="text-stone-500 text-[9px] uppercase tracking-[0.3em]">Directorio Comercial • Punto 506</p>
                </div>
            </div>
        </div>
        
        <div class="flex gap-10">
            <div class="text-right">
                <span class="block text-p506-gold font-bold text-xl leading-none" id="count-stories">--</span>
                <span class="text-[7px] uppercase tracking-widest text-stone-600 font-bold">Entrevistas</span>
            </div>
            <div class="text-right">
                <span class="block text-white font-bold text-xl leading-none">LIMÓN</span>
                <span class="text-[7px] uppercase tracking-widest text-stone-600 font-bold">Región Atlántica</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="grid-entrevistas" class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-10">
            <div class="h-64 bg-white/5 animate-pulse rounded-r-2xl"></div>
            <div class="h-64 bg-white/5 animate-pulse rounded-r-2xl"></div>
        </div>
    </main>

    <footer class="mt-20 max-w-7xl mx-auto border-t border-white/5 py-10 flex justify-between items-center">
        <p class="text-[8px] text-stone-600 uppercase tracking-[0.5em]">© 2026 Crafted by MontZu</p>
        <div class="h-[1px] w-20 bg-p506-gold/20"></div>
    </footer>

    <script type="module">
        import { cargarEntrevistas } from './entrevistas.js';
        import { supabase } from './supabase.js';

        async function registrarEntrada() {
            try {
                const { error } = await supabase
                    .from('registros_actividad')
                    .insert([
                        { 
                            tipo_evento: 'visita_pagina', 
                            nombre_negocio: 'Punto 506 - Entrevistas',
                            fecha: new Date().toISOString() 
                        }
                    ]);
                if (error) console.error('Error al registrar actividad:', error);
            } catch (err) {
                console.error('Error de conexión con Supabase:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarEntrevistas();
            registrarEntrada();
        });
    </script>
</body>
</html>
