    <style>
        .serif-title { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.2em; }
        
        body { 
            background: #0a0908;
            overflow-x: hidden;
        }

        /* Luces de fondo ambientales */
        .ambient-light {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.05) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
        }

        .text-gradient {
            background: linear-gradient(to bottom, #fef3c7 0%, #d4a373 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tarjeta Estilo Cine */
        .video-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .video-card:hover {
            border-color: rgba(212, 163, 115, 0.5);
            transform: translateY(-10px) scale(1.01);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Efecto de decoración en el título */
        .title-underline {
            height: 2px;
            width: 60px;
            background: linear-gradient(90deg, #d4a373, transparent);
            margin-top: 8px;
        }

</head>
