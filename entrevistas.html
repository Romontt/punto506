<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Entrevistas | Punto 506 - Historias de Pococí</title>
    <meta name="description" content="Descubre las historias detrás de los comercios y emprendedores más emblemáticos de Pococí.">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Series",
      "name": "Entrevistas Punto 506",
      "description": "Historias de éxito y emprendimiento en el cantón de Pococí.",
      "publisher": { "@type": "Organization", "name": "Punto 506" }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        .serif-title { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.25em; }
        
        body { background: #070707; color: #d1d5db; overflow-x: hidden; }

        /* Textura de fondo */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(#d4a373 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
        }

        .ambient-light {
            position: fixed;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.07) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: -2; filter: blur(100px);
        }

        .text-gradient {
            background: linear-gradient(180deg, #fff 0%, #d4a373 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tarjetas con efecto de profundidad */
        .video-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .video-card::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit; opacity: 0;
            box-shadow: 0 0 30px rgba(212, 163, 115, 0.15);
            transition: opacity 0.6s;
        }

        .video-card:hover {
            transform: translateY(-12px);
            border-color: rgba(212, 163, 115, 0.4);
        }

        .video-card:hover::after { opacity: 1; }

        /* Líneas decorativas animadas */
        .separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.5), transparent);
        }
    </style>
</head>
<body class="font-['Inter']">

    <div class="grid-overlay"></div>
    <div class="ambient-light top-[-20%] left-[-10%]"></div>
    <div class="ambient-light bottom-[-20%] right-[-10%]"></div>

    <nav class="max-w-7xl mx-auto p-8 flex justify-between items-center">
        <a href="/" class="group flex items-center gap-4">
            <span class="w-12 h-12 rounded-full border border-p506-gold/20 flex items-center justify-center text-p506-gold font-bold group-hover:scale-110 group-hover:border-p506-gold transition-all">506</span>
            <span class="text-[9px] uppercase tracking-[0.5em] text-stone-500 group-hover:text-white transition-colors">Volver a la base</span>
        </a>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-10 pb-20 grid md:grid-cols-2 gap-12 items-center">
        <div>
            <div class="flex items-center gap-4 mb-6">
                <span class="h-[1px] w-12 bg-p506-gold"></span>
                <span class="text-p506-gold text-[10px] uppercase tracking-[0.6em] font-bold">Documentales Locales</span>
            </div>
            <h1 class="serif-title text-6xl md:text-8xl font-bold text-gradient leading-none mb-6">Voces de<br>Pococí</h1>
            <p class="max-w-md text-stone-400 text-sm md:text-base leading-relaxed mb-8">
                Un archivo visual dedicado a preservar la historia de los negocios que dan vida a nuestro cantón. Historias reales, gente nuestra.
            </p>
            <div class="flex items-center gap-8">
                <div>
                    <span class="block text-2xl font-bold text-white" id="count-stories">0</span>
                    <span class="text-[8px] uppercase tracking-widest text-p506-gold">Historias</span>
                </div>
                <div class="w-[1px] h-8 bg-white/10"></div>
                <div>
                    <span class="block text-2xl font-bold text-white">100%</span>
                    <span class="text-[8px] uppercase tracking-widest text-p506-gold">Puntarenense</span>
                </div>
            </div>
        </div>
        <div class="hidden md:block relative">
            <div class="absolute inset-0 bg-p506-gold/10 blur-[100px] rounded-full"></div>
            <img src="https://images.unsplash.com/photo-1598897349489-44769b7b1ace?auto=format&fit=crop&q=80&w=800" alt="Cinematic" class="rounded-2xl grayscale opacity-40 border border-white/5 shadow-2xl">
        </div>
    </header>

    <div class="separator max-w-7xl mx-auto mb-20"></div>

    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="grid-entrevistas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            <div class="space-y-4">
                <div class="aspect-video bg-white/5 rounded-xl animate-pulse"></div>
                <div class="h-4 w-1/2 bg-white/5 animate-pulse"></div>
            </div>
            <div class="space-y-4">
                <div class="aspect-video bg-white/5 rounded-xl animate-pulse"></div>
                <div class="h-4 w-1/2 bg-white/5 animate-pulse"></div>
            </div>
            <div class="space-y-4">
                <div class="aspect-video bg-white/5 rounded-xl animate-pulse"></div>
                <div class="h-4 w-1/2 bg-white/5 animate-pulse"></div>
            </div>
        </div>
    </main>

    <footer class="bg-black/50 backdrop-blur-xl border-t border-white/5 py-16">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h3 class="serif-title text-white text-xs mb-2">Punto 506</h3>
                <p class="text-[9px] text-stone-500 uppercase tracking-widest">El pulso comercial de la zona atlántica</p>
            </div>
            <p class="text-[8px] text-stone-600 uppercase tracking-[0.4em]">© 2026 Crafted by MontZu</p>
        </div>
    </footer>

    <script type="module">
        import { cargarEntrevistas } from './entrevistas.js';
        document.addEventListener('DOMContentLoaded', cargarEntrevistas);
    </script>
</body>
</html>
