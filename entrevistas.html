<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevistas | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .serif-title { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.15em; }
        body { background: radial-gradient(circle at top center, #1c1917 0%, #0a0908 100%); min-height: screen; }
        .text-gradient {
            background: linear-gradient(to bottom, #fef3c7 0%, #d4a373 50%, #b45309 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .video-card { 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
            border: 1px solid rgba(212, 163, 115, 0.1); 
        }
        .video-card:hover { 
            border-color: #d4a373; 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.8); 
        }
    </style>
</head>
<body class="text-stone-300 p-6 md:p-12">

    <header class="max-w-6xl mx-auto mb-16">
        <a href="/" class="text-p506-gold text-[10px] uppercase tracking-[0.4em] mb-4 inline-block hover:opacity-70 transition">← Inicio</a>
        <h1 class="serif-title text-4xl md:text-5xl text-white font-bold text-gradient">Entrevistas</h1>
        <p class="text-[#d4a373] text-xs uppercase tracking-[0.4em] mt-2 opacity-80 font-semibold">Historias con Sabor Local</p>
    </header>

    <main id="grid-entrevistas" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-20">
            <p class="animate-pulse uppercase tracking-[0.3em] text-[10px] text-p506-gold">Conectando con la base de datos...</p>
        </div>
    </main>

    <script type="module">
        import { cargarEntrevistas } from './entrevistas.js';
        document.addEventListener('DOMContentLoaded', cargarEntrevistas);
    </script>
</body>
</html>
