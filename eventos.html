<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Eventos | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;800&family=Baskervville:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a373;
            --dark: #130f0e;
            --card-bg: #1c1817;
        }
        body { 
            background-color: var(--dark); 
            font-family: 'Inter', sans-serif; 
            color: #e5e7eb;
            background-image: radial-gradient(circle at 50% -20%, #2a1f1d 0%, #130f0e 60%);
        }
        .serif-title { font-family: 'Cinzel', serif; }
        
        /* Tarjeta tipo Poster */
        .event-poster {
            background: var(--card-bg);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .event-poster:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .poster-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ticket-date {
            background: var(--gold);
            color: var(--dark);
            clip-path: polygon(100% 0%, 100% 85%, 50% 100%, 0 85%, 0 0);
        }

        .shimmer {
            background: linear-gradient(90deg, #1c1817 25%, #2a2524 50%, #1c1817 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .btn-gold {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            transition: all 0.3s;
        }
        .btn-gold:hover {
            background: var(--gold);
            color: var(--dark);
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            margin-top: 1rem;
        }
        .section-divider div {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(to right, var(--gold), transparent);
        }

        /* Estilos para el Tab Nav */
        .tab-nav-btn {
            position: relative;
            transition: all 0.4s ease;
        }
        .tab-nav-btn.active {
            color: var(--gold);
        }
        .tab-nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 2px;
            background: var(--gold);
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-full border border-[var(--gold)] flex items-center justify-center">
                <span class="text-[var(--gold)] text-xs font-bold serif-title">506</span>
            </div>
            <span class="serif-title tracking-[0.3em] text-white text-sm hidden md:block uppercase">Punto 506</span>
        </div>
        <a href="index.html" class="text-[10px] tracking-[0.3em] text-stone-500 hover:text-[var(--gold)] uppercase transition-colors">Cerrar Cartelera</a>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <header class="mb-12 text-center">
            <h2 class="serif-title text-4xl md:text-6xl text-white mb-4 tracking-tight">PRÓXIMOS <span class="text-[var(--gold)]">EVENTOS</span></h2>
            
            <div class="flex justify-center items-center gap-8 md:gap-12 mt-8 mb-4 border-b border-white/5 pb-6">
                <button id="tab-discotecas" onclick="switchTab('discotecas')" class="tab-nav-btn active serif-title text-xs md:text-sm tracking-[0.3em] uppercase font-bold text-stone-400 hover:text-white">
                    Nightlife & Discotecas
                </button>
                <button id="tab-shows" onclick="switchTab('shows')" class="tab-nav-btn serif-title text-xs md:text-sm tracking-[0.3em] uppercase font-bold text-stone-400 hover:text-white">
                    Shows & Conciertos
                </button>
            </div>
        </header>

        <div id="section-discotecas" class="hidden">
            <div class="section-divider">
                <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">Cartelera Nocturna</h3>
                <div></div>
            </div>
            <div id="discotecas-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>

        <div id="section-shows" class="hidden">
            <div class="section-divider">
                <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">Espectáculos en Vivo</h3>
                <div></div>
            </div>
            <div id="shows-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>

        <div id="loading-placeholders" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <div class="shimmer h-[600px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[600px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[600px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[600px] rounded-lg opacity-10"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="text-stone-500 serif-title text-xl tracking-widest uppercase">No hay eventos en esta categoría</p>
        </div>
    </main>

    <script type="module">
        import { supabaseEventos } from './supabase-eventos.js';

        // Variable global para controlar qué pestaña está activa
        window.currentTab = 'discotecas'; 

        window.switchTab = (tab) => {
            window.currentTab = tab;
            const secDiscotecas = document.getElementById('section-discotecas');
            const secShows = document.getElementById('section-shows');
            const btnDiscotecas = document.getElementById('tab-discotecas');
            const btnShows = document.getElementById('tab-shows');

            if (tab === 'discotecas') {
                secDiscotecas.classList.remove('hidden');
                secShows.classList.add('hidden');
                btnDiscotecas.classList.add('active');
                btnShows.classList.remove('active');
            } else {
                secDiscotecas.classList.add('hidden');
                secShows.classList.remove('hidden');
                btnDiscotecas.classList.remove('active');
                btnShows.classList.add('active');
            }
            
            // Verificar si la sección activa está vacía
            const currentGrid = document.getElementById(`${tab}-grid`);
            const noEvents = document.getElementById('no-events');
            if (currentGrid.children.length === 0) {
                noEvents.classList.remove('hidden');
            } else {
                noEvents.classList.add('hidden');
            }
        };

        function createEventCard(evento) {
            const fechaObj = new Date(evento.fecha + 'T00:00:00');
            const dia = fechaObj.getDate();
            const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();

            const card = document.createElement('div');
            card.className = 'event-poster rounded-xl group';
            card.innerHTML = `
                <div class="poster-wrapper relative">
                    <img src="${evento.imagen_url}" alt="${evento.titulo}" loading="lazy">
                    <div class="absolute top-0 left-4 z-20">
                        <div class="ticket-date px-3 py-4 text-center min-w-[50px] font-black shadow-2xl">
                            <span class="block text-xl leading-none">${dia}</span>
                            <span class="text-[10px] tracking-tighter">${mes}</span>
                        </div>
                    </div>
                    <div class="absolute top-4 right-4 z-20">
                        <div class="bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
                            <span class="text-[10px] text-white font-bold tracking-widest uppercase">${evento.hora}</span>
                        </div>
                    </div>
                </div>
                <div class="p-6 flex flex-col flex-grow bg-[#1c1817] border-t border-white/5">
                    <h3 class="serif-title text-xl text-white mb-2 leading-tight group-hover:text-[var(--gold)] transition-colors">
                        ${evento.titulo}
                    </h3>
                    <div class="flex items-center gap-2 text-stone-400 text-xs mb-6 font-light italic">
                        <svg class="w-3 h-3 text-[var(--gold)]" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                        </svg>
                        ${evento.lugar}
                    </div>
                    <div class="mt-auto">
                        <a href="${evento.link_contacto || '#'}" target="_blank" 
                           class="btn-gold block w-full text-center py-3 text-[10px] font-black tracking-[0.3em] uppercase rounded-sm shadow-lg">
                            OBTENER INFORMACIÓN
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        async function cargarEventos() {
            const discotecasGrid = document.getElementById('discotecas-grid');
            const showsGrid = document.getElementById('shows-grid');
            const loaders = document.getElementById('loading-placeholders');

            try {
                const { data: eventos, error } = await supabaseEventos
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;
                
                loaders.classList.add('hidden');
                discotecasGrid.innerHTML = '';
                showsGrid.innerHTML = '';

                if (eventos && eventos.length > 0) {
                    eventos.forEach(evento => {
                        const card = createEventCard(evento);
                        if (evento.es_discoteca) {
                            discotecasGrid.appendChild(card);
                        } else {
                            showsGrid.appendChild(card);
                        }
                    });
                }

                // Iniciar en la pestaña por defecto
                switchTab(window.currentTab);

            } catch (err) {
                console.error("Error cargando eventos:", err);
                loaders.innerHTML = `<p class="text-[var(--gold)] col-span-full text-center text-[10px] tracking-[0.4em]">ERROR DE SINCRONIZACIÓN</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
