<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Próximos | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050b1a; font-family: 'Inter', sans-serif; color: #d1d5db; }
        .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .event-card { 
            background: #0f172a; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.3s ease;
        }
        .event-card:hover { 
            transform: translateY(-5px); 
            border-color: #3b82f6;
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
        }
        .shimmer {
            background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-white tracking-tighter">PUNTO<span class="text-blue-500">506</span></h1>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">Volver al Inicio</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <header class="mb-12 text-center md:text-left">
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">Eventos en Pococí</h2>
            <p class="text-slate-400 max-w-2xl">Descubre los mejores conciertos, ferias y actividades locales. ¡No te pierdas nada!</p>
        </header>

        <div id="eventos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <div class="shimmer h-[450px] rounded-3xl opacity-20"></div>
            <div class="shimmer h-[450px] rounded-3xl opacity-20"></div>
            <div class="shimmer h-[450px] rounded-3xl opacity-20"></div>
            <div class="shimmer h-[450px] rounded-3xl opacity-20"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="text-slate-500 text-lg">No hay eventos programados por ahora. ¡Vuelve pronto!</p>
        </div>
    </main>

    <script type="module">
        import { supabase } from './supabase.js';

        async function cargarEventos() {
            const grid = document.getElementById('eventos-grid');
            const noEvents = document.getElementById('no-events');

            try {
                // Obtenemos los eventos aprobados y ordenados por fecha
                const { data: eventos, error } = await supabase
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;

                // Limpiar el grid (quitar los skeletons)
                grid.innerHTML = '';

                if (!eventos || eventos.length === 0) {
                    noEvents.classList.remove('hidden');
                    return;
                }

                eventos.forEach(evento => {
                    const card = document.createElement('div');
                    card.className = 'event-card rounded-3xl overflow-hidden flex flex-col h-full';
                    
                    // Formatear la fecha
                    const fechaObj = new Date(evento.fecha + 'T00:00:00');
                    const dia = fechaObj.getDate();
                    const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();

                    card.innerHTML = `
                        <div class="relative h-72 overflow-hidden">
                            <img src="${evento.imagen_url}" alt="${evento.titulo}" class="w-full h-full object-cover">
                            <div class="absolute top-4 left-4 bg-blue-600 text-white px-3 py-1 rounded-lg text-center shadow-lg">
                                <span class="block text-xl font-bold leading-none">${dia}</span>
                                <span class="text-[10px] font-bold tracking-widest uppercase">${mes}</span>
                            </div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex items-center gap-2 text-blue-500 text-[10px] font-bold uppercase tracking-widest mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                ${evento.hora}
                            </div>
                            <h3 class="text-white text-xl font-bold mb-2 line-clamp-2">${evento.titulo}</h3>
                            <div class="flex items-start gap-2 text-slate-500 text-sm mb-6 italic">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span>${evento.lugar}</span>
                            </div>
                            <a href="${evento.link_contacto || '#'}" target="_blank" 
                               class="mt-auto block w-full text-center py-3 bg-slate-800 hover:bg-blue-600 text-white text-xs font-bold uppercase tracking-widest rounded-xl transition-all">
                                Ver Detalles / Entradas
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error('Error cargando eventos:', err);
                grid.innerHTML = `<p class="text-red-500 col-span-full text-center">Error al conectar con la base de datos.</p>`;
            }
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
