<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Punto 506 - Guápiles</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&family=Baskervville:italic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">

    <style>
        body { background-color: #130f0e; font-family: 'Inter', sans-serif; color: #d1d5db; }
        .serif-title { font-family: 'Cinzel', serif; }
        .elegant-italic { font-family: 'Baskervville', serif; font-style: italic; }
        
        /* Estilo de Tarjeta Evento */
        .event-card { 
            background: #1a1514; 
            border: 1px solid rgba(212, 163, 115, 0.1); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .event-card:hover { 
            border-color: #d4a373;
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .date-badge {
            background: rgba(19, 15, 14, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 163, 115, 0.3);
        }

        .shimmer {
            background: linear-gradient(90deg, #1a1514 25%, #2a2220 50%, #1a1514 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Preloader similar al index */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #130f0e; display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }
    </style>
</head>
<body class="antialiased">

    <div id="preloader" class="transition-opacity duration-500">
        <div class="flex flex-col items-center gap-4">
            <div class="w-16 h-16 rounded-full flex items-center justify-center border-2 border-[#d4a373]">
                <span class="serif-title text-lg text-[#d4a373] font-bold">506</span>
            </div>
            <span class="text-[8px] tracking-[0.5em] font-black text-[#d4a373] uppercase">Cargando Eventos</span>
        </div>
    </div>

    <nav class="bg-[#130f0e]/95 backdrop-blur-2xl border-b border-[#d4a373]/10 sticky top-0 z-50 w-full">
        <div class="w-full flex justify-center py-4 border-b border-[#d4a373]/10">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="flex flex-col items-center gap-1">
                    <div class="w-10 h-10 iso-emblem rounded-full flex items-center justify-center border border-[#d4a373]/30">
                        <span class="serif-title text-[9px] text-[#d4a373] font-bold">506</span>
                    </div>
                </div>
                <div class="h-8 w-[1px] bg-[#d4a373]/20"></div>
                <div class="flex flex-col justify-center">
                    <h1 class="serif-title text-xl tracking-[0.3em] text-white uppercase font-normal leading-none">Punto 506</h1>
                    <p class="text-[#d4a373]/60 uppercase tracking-[0.4em] text-[6px] font-bold mt-1">CARTELERA DE EVENTOS</p>
                </div>
            </div>
        </div>
    </nav>

    <header class="relative py-16 header-texture border-b border-[#d4a373]/10 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#130f0e]"></div>
        <div class="relative z-10 max-w-4xl mx-auto text-center px-6">
            <h2 class="serif-title text-[#d4a373] text-[12px] tracking-[0.6em] mb-4 uppercase font-bold">Experiencias Locales</h2>
            <p class="elegant-italic text-white text-3xl md:text-4xl">¿Qué hacer en Pococí?</p>
            <div class="w-20 h-[1px] bg-[#d4a373]/40 mx-auto mt-6"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <div id="eventos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            <div class="shimmer h-[450px] rounded-sm opacity-10"></div>
            <div class="shimmer h-[450px] rounded-sm opacity-10"></div>
            <div class="shimmer h-[450px] rounded-sm opacity-10"></div>
            <div class="shimmer h-[450px] rounded-sm opacity-10"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="elegant-italic text-stone-500 text-xl">No hay eventos programados en este momento.</p>
            <a href="index.html" class="inline-block mt-6 text-[#d4a373] text-[10px] tracking-[0.3em] uppercase border-b border-[#d4a373] pb-1">Volver al inicio</a>
        </div>
    </main>

    <footer class="border-t border-[#d4a373]/10 py-10 text-center">
        <p class="text-[8px] tracking-[0.4em] text-[#d4a373]/40 uppercase">Punto 506 © 2026 | Descubre Pococí</p>
    </footer>

    <script type="module">
        import { supabase } from './supabase.js';

        // Quitar preloader
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => preloader.remove(), 500);
        });

        async function cargarEventos() {
            const grid = document.getElementById('eventos-grid');
            const noEvents = document.getElementById('no-events');

            try {
                const { data: eventos, error } = await supabase
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;

                grid.innerHTML = '';

                if (!eventos || eventos.length === 0) {
                    noEvents.classList.remove('hidden');
                    return;
                }

                eventos.forEach(evento => {
                    const card = document.createElement('div');
                    card.className = 'event-card rounded-sm overflow-hidden flex flex-col h-full';
                    
                    const fechaObj = new Date(evento.fecha + 'T00:00:00');
                    const dia = fechaObj.getDate();
                    const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '');

                    card.innerHTML = `
                        <div class="relative h-80 overflow-hidden">
                            <img src="${evento.imagen_url}" alt="${evento.titulo}" class="w-full h-full object-cover grayscale-[30%] hover:grayscale-0 transition-all duration-700">
                            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-t from-[#130f0e] to-transparent opacity-60"></div>
                            <div class="absolute bottom-4 left-4 date-badge px-4 py-2 text-center rounded-sm">
                                <span class="block text-2xl font-bold text-[#d4a373] leading-none">${dia}</span>
                                <span class="text-[9px] font-black text-white tracking-[0.2em] uppercase">${mes}</span>
                            </div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex items-center gap-2 text-[#d4a373] text-[9px] font-bold uppercase tracking-[0.2em] mb-3">
                                <span class="w-4 h-[1px] bg-[#d4a373]/50"></span>
                                ${evento.hora}
                            </div>
                            <h3 class="serif-title text-white text-lg mb-2 leading-snug">${evento.titulo}</h3>
                            <p class="elegant-italic text-stone-500 text-sm mb-6">${evento.lugar}</p>
                            
                            <a href="${evento.link_contacto || '#'}" target="_blank" 
                               class="mt-auto block w-full text-center py-4 border border-[#d4a373]/20 hover:bg-[#d4a373] hover:text-[#130f0e] text-[#d4a373] text-[9px] font-black uppercase tracking-[0.3em] transition-all duration-500">
                                MÁS INFORMACIÓN
                            </a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error('Error:', err);
                grid.innerHTML = `<p class="text-[#d4a373] col-span-full text-center text-xs tracking-widest uppercase">Error al conectar con la cartelera.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
