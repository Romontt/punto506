<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Eventos | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;800&family=Baskervville:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a373;
            --dark: #130f0e;
            --card-bg: #1c1817;
        }
        body { 
            background-color: var(--dark); 
            font-family: 'Inter', sans-serif; 
            color: #e5e7eb;
            background-image: radial-gradient(circle at 50% -20%, #2a1f1d 0%, #130f0e 60%);
        }
        .serif-title { font-family: 'Cinzel', serif; }
        
        .event-poster {
            background: var(--card-bg);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .event-poster:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .poster-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ticket-date {
            background: var(--gold);
            color: var(--dark);
            clip-path: polygon(100% 0%, 100% 85%, 50% 100%, 0 85%, 0 0);
        }

        .shimmer {
            background: linear-gradient(90deg, #1c1817 25%, #2a2524 50%, #1c1817 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .btn-gold {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            transition: all 0.3s;
        }
        .btn-gold:hover {
            background: var(--gold);
            color: var(--dark);
        }

        /* Estilos para el Sub-Nav */
        .sub-nav-btn {
            position: relative;
            transition: all 0.4s ease;
            white-space: nowrap;
        }
        .sub-nav-btn.active {
            color: var(--gold);
            font-weight: 800;
        }
        .sub-nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--gold);
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-full border border-[var(--gold)] flex items-center justify-center">
                <span class="text-[var(--gold)] text-xs font-bold serif-title">506</span>
            </div>
            <span class="serif-title tracking-[0.3em] text-white text-sm hidden md:block uppercase">Punto 506</span>
        </div>
        <a href="index.html" class="text-[10px] tracking-[0.3em] text-stone-500 hover:text-[var(--gold)] uppercase transition-colors">Cerrar Cartelera</a>
    </nav>

    <div class="sticky top-0 z-50 bg-[#130f0e]/80 backdrop-blur-md border-b border-white/5 mb-8">
        <div class="max-w-7xl mx-auto px-6 overflow-x-auto">
            <div class="flex justify-center items-center gap-6 md:gap-12 py-4">
                <button onclick="switchCategory('lab')" class="cat-btn sub-nav-btn active serif-title text-[9px] md:text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-white">EL LAB</button>
                <button onclick="switchCategory('lux')" class="cat-btn sub-nav-btn serif-title text-[9px] md:text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-white">LUX</button>
                <button onclick="switchCategory('punta')" class="cat-btn sub-nav-btn serif-title text-[9px] md:text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-white">PUNTA MONA</button>
                <button onclick="switchCategory('shows')" class="cat-btn sub-nav-btn serif-title text-[9px] md:text-[11px] tracking-[0.2em] uppercase text-stone-400 hover:text-white">SHOWS</button>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 pb-20">
        <header class="mb-12 text-center">
            <h2 class="serif-title text-4xl md:text-5xl text-white mb-4 tracking-tight">CARTELERA <span class="text-[var(--gold)]">DISPONIBLE</span></h2>
        </header>

        <div id="grid-container">
            <div id="lab-section" class="cat-section grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            <div id="lux-section" class="cat-section hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            <div id="punta-section" class="cat-section hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            <div id="shows-section" class="cat-section hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
        </div>

        <div id="loading-placeholders" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="text-stone-500 serif-title text-xl tracking-widest uppercase">No hay eventos en esta categoría</p>
        </div>
    </main>

    <script type="module">
        import { supabaseEventos } from './supabase-eventos.js';

        window.switchCategory = (catId) => {
            // Actualizar botones del nav
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Actualizar secciones visibles
            document.querySelectorAll('.cat-section').forEach(sec => sec.classList.add('hidden'));
            const activeSection = document.getElementById(`${catId}-section`);
            activeSection.classList.remove('hidden');

            // Mostrar mensaje si está vacío
            const noEvents = document.getElementById('no-events');
            if (activeSection.children.length === 0) {
                noEvents.classList.remove('hidden');
            } else {
                noEvents.classList.add('hidden');
            }
        };

        function createEventCard(evento) {
            const fechaObj = new Date(evento.fecha + 'T00:00:00');
            const dia = fechaObj.getDate();
            const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();

            const card = document.createElement('div');
            card.className = 'event-poster rounded-xl group';
            card.innerHTML = `
                <div class="poster-wrapper relative">
                    <img src="${evento.imagen_url}" alt="${evento.titulo}" loading="lazy">
                    <div class="absolute top-0 left-4 z-20">
                        <div class="ticket-date px-3 py-4 text-center min-w-[50px] font-black shadow-2xl">
                            <span class="block text-xl leading-none">${dia}</span>
                            <span class="text-[10px] tracking-tighter">${mes}</span>
                        </div>
                    </div>
                </div>
                <div class="p-6 flex flex-col flex-grow bg-[#1c1817] border-t border-white/5">
                    <h3 class="serif-title text-xl text-white mb-2 leading-tight group-hover:text-[var(--gold)] transition-colors">
                        ${evento.titulo}
                    </h3>
                    <div class="flex items-center gap-2 text-stone-400 text-xs mb-6 font-light italic">
                        <svg class="w-3 h-3 text-[var(--gold)]" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                        </svg>
                        ${evento.lugar}
                    </div>
                    <div class="mt-auto">
                        <a href="${evento.link_contacto || '#'}" target="_blank" 
                           class="btn-gold block w-full text-center py-3 text-[10px] font-black tracking-[0.3em] uppercase rounded-sm">
                            INFO & RESERVAS
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        async function cargarEventos() {
            const loaders = document.getElementById('loading-placeholders');
            
            try {
                const { data: eventos, error } = await supabaseEventos
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;
                loaders.classList.add('hidden');

                if (eventos && eventos.length > 0) {
                    eventos.forEach(evento => {
                        const card = createEventCard(evento);
                        const lugar = evento.lugar.toUpperCase();

                        if (evento.es_discoteca) {
                            if (lugar.includes('LAB')) document.getElementById('lab-section').appendChild(card);
                            else if (lugar.includes('LUX')) document.getElementById('lux-section').appendChild(card);
                            else if (lugar.includes('PUNTA')) document.getElementById('punta-section').appendChild(card);
                        } else {
                            document.getElementById('shows-section').appendChild(card);
                        }
                    });
                }
                
                // Forzar verificación de estado inicial (EL LAB activo por defecto)
                const labSec = document.getElementById('lab-section');
                if(labSec.children.length === 0) document.getElementById('no-events').classList.remove('hidden');

            } catch (err) {
                console.error("Error cargando eventos:", err);
                loaders.innerHTML = `<p class="text-[var(--gold)] col-span-full text-center py-10">ERROR DE CONEXIÓN</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
