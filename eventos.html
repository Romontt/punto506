<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Eventos | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;800&family=Baskervville:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a373;
            --dark: #130f0e;
        }
        body { 
            background-color: var(--dark); 
            font-family: 'Inter', sans-serif; 
            color: #e5e7eb;
            background-image: radial-gradient(circle at 50% -20%, #2a1f1d 0%, #130f0e 60%);
        }
        .serif-title { font-family: 'Cinzel', serif; }
        
        /* Tarjeta tipo Poster */
        .event-poster {
            background: #1c1817;
            border: 1px solid rgba(212, 163, 115, 0.1);
            position: relative;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .event-poster:hover {
            transform: scale(1.02) translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(212, 163, 115, 0.15);
        }

        /* Efecto Glow en el hover */
        .event-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--dark) 0%, transparent 100%);
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        /* Fecha estilo "Ticket" */
        .ticket-date {
            background: var(--gold);
            color: var(--dark);
            clip-path: polygon(100% 0%, 100% 85%, 50% 100%, 0 85%, 0 0);
        }

        .shimmer {
            background: linear-gradient(90deg, #1c1817 25%, #2a2524 50%, #1c1817 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .btn-gold {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            transition: all 0.3s;
        }
        .btn-gold:hover {
            background: var(--gold);
            color: var(--dark);
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-full border border-[var(--gold)] flex items-center justify-center">
                <span class="text-[var(--gold)] text-xs font-bold serif-title">506</span>
            </div>
            <span class="serif-title tracking-[0.3em] text-white text-sm hidden md:block uppercase">Punto 506</span>
        </div>
        <a href="index.html" class="text-[10px] tracking-[0.3em] text-stone-500 hover:text-[var(--gold)] uppercase transition-colors">Cerrar Cartelera</a>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <header class="mb-16 text-center">
            <h2 class="serif-title text-4xl md:text-6xl text-white mb-4 tracking-tight">PRÓXIMOS <span class="text-[var(--gold)]">EVENTOS</span></h2>
            <p class="text-stone-400 font-light italic tracking-widest text-sm uppercase">Lo mejor de Pococí en un solo lugar</p>
        </header>

        <div id="eventos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[500px] rounded-lg opacity-10"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="text-stone-500 serif-title text-xl tracking-widest">NO HAY FUNCIONES PROGRAMADAS</p>
        </div>
    </main>

    <script type="module">
        import { supabase } from './supabase.js';

        async function cargarEventos() {
            const grid = document.getElementById('eventos-grid');
            const noEvents = document.getElementById('no-events');

            try {
                const { data: eventos, error } = await supabase
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;
                grid.innerHTML = '';

                if (!eventos || eventos.length === 0) {
                    noEvents.classList.remove('hidden');
                    return;
                }

                eventos.forEach(evento => {
                    const fechaObj = new Date(evento.fecha + 'T00:00:00');
                    const dia = fechaObj.getDate();
                    const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();

                    const card = document.createElement('div');
                    card.className = 'event-poster rounded-xl group flex flex-col h-[520px]';
                    
                    card.innerHTML = `
                        <div class="absolute inset-0 z-0">
                            <img src="${evento.imagen_url}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        </div>
                        
                        <div class="relative z-10 p-6 flex flex-col h-full justify-between">
                            <div class="flex justify-between items-start">
                                <div class="ticket-date px-3 py-4 text-center min-w-[50px] font-black shadow-2xl">
                                    <span class="block text-xl leading-none">${dia}</span>
                                    <span class="text-[10px] tracking-tighter">${mes}</span>
                                </div>
                                <div class="bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/10">
                                    <span class="text-[10px] text-white font-bold tracking-widest uppercase">${evento.hora}</span>
                                </div>
                            </div>

                            <div class="transform transition-all duration-500">
                                <h3 class="serif-title text-2xl text-white mb-2 leading-tight drop-shadow-lg">${evento.titulo}</h3>
                                <div class="flex items-center gap-2 text-stone-300 text-xs mb-6 font-light italic">
                                    <svg class="w-3 h-3 text-[var(--gold)]" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                                    ${evento.lugar}
                                </div>
                                <a href="${evento.link_contacto || '#'}" target="_blank" 
                                   class="btn-gold block w-full text-center py-3 text-[10px] font-black tracking-[0.3em] uppercase rounded-sm">
                                    OBTENER INFORMACIÓN
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = `<p class="text-[var(--gold)] col-span-full text-center text-[10px] tracking-[0.4em]">ERROR DE SINCRONIZACIÓN</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
