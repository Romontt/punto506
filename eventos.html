<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Eventos | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;800&family=Baskervville:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a373;
            --dark: #130f0e;
            --card-bg: #1c1817;
        }
        body { 
            background-color: var(--dark); 
            font-family: 'Inter', sans-serif; 
            color: #e5e7eb;
            background-image: radial-gradient(circle at 50% -20%, #2a1f1d 0%, #130f0e 60%);
        }
        .serif-title { font-family: 'Cinzel', serif; }
        
        .event-poster {
            background: var(--card-bg);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .event-poster:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .poster-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ticket-date {
            background: var(--gold);
            color: var(--dark);
            clip-path: polygon(100% 0%, 100% 85%, 50% 100%, 0 85%, 0 0);
        }

        .shimmer {
            background: linear-gradient(90deg, #1c1817 25%, #2a2524 50%, #1c1817 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .btn-gold {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            transition: all 0.3s;
        }
        .btn-gold:hover {
            background: var(--gold);
            color: var(--dark);
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            margin-top: 1rem;
        }
        .section-divider div {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(to right, var(--gold), transparent);
        }

        .tab-nav-btn, .sub-tab-btn {
            position: relative;
            transition: all 0.4s ease;
        }
        .tab-nav-btn.active, .sub-tab-btn.active {
            color: var(--gold);
        }
        .tab-nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 2px;
            background: var(--gold);
        }
        .sub-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--gold);
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-10 h-10 rounded-full border border-[var(--gold)] flex items-center justify-center">
                <span class="text-[var(--gold)] text-xs font-bold serif-title">506</span>
            </div>
            <span class="serif-title tracking-[0.3em] text-white text-sm hidden md:block uppercase">Punto 506</span>
        </div>
        <div class="flex items-center gap-6">
            <a href="https://wa.me/50662117858?text=Hola!%20Me%20gustaría%20publicar%20un%20evento%20en%20Punto%20506" target="_blank" class="px-4 py-2 border border-[var(--gold)] text-[var(--gold)] text-[9px] md:text-[10px] tracking-[0.2em] font-black uppercase hover:bg-[var(--gold)] hover:text-black transition-all rounded-sm">
                Publica tu evento
            </a>
            <a href="index.html" class="text-[10px] tracking-[0.3em] text-stone-500 hover:text-[var(--gold)] uppercase transition-colors">Cerrar Cartelera</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <header class="mb-12 text-center">
            <h2 class="serif-title text-4xl md:text-6xl text-white mb-4 tracking-tight">PRÓXIMOS <span class="text-[var(--gold)]">EVENTOS</span></h2>
            
            <div class="flex justify-center items-center gap-8 md:gap-12 mt-8 mb-4 border-b border-white/5 pb-6">
                <button id="tab-discotecas" onclick="switchTab('discotecas')" class="tab-nav-btn active serif-title text-xs md:text-sm tracking-[0.3em] uppercase font-bold text-stone-400 hover:text-white">
                    Nightlife & Discotecas
                </button>
                <button id="tab-shows" onclick="switchTab('shows')" class="tab-nav-btn serif-title text-xs md:text-sm tracking-[0.3em] uppercase font-bold text-stone-400 hover:text-white">
                    Shows & Conciertos
                </button>
            </div>
        </header>

        <div id="section-discotecas" class="hidden space-y-12">
            <div class="flex justify-center gap-4 md:gap-10 mb-10 overflow-x-auto pb-2">
                <button onclick="filterDisco('all')" class="sub-tab-btn active serif-title text-[9px] md:text-[10px] tracking-widest uppercase text-stone-500 hover:text-white whitespace-nowrap">Todo</button>
                <button onclick="filterDisco('lab')" class="sub-tab-btn serif-title text-[9px] md:text-[10px] tracking-widest uppercase text-stone-500 hover:text-white whitespace-nowrap">El Lab</button>
                <button onclick="filterDisco('lux')" class="sub-tab-btn serif-title text-[9px] md:text-[10px] tracking-widest uppercase text-stone-500 hover:text-white whitespace-nowrap">Lux</button>
                <button onclick="filterDisco('punta')" class="sub-tab-btn serif-title text-[9px] md:text-[10px] tracking-widest uppercase text-stone-500 hover:text-white whitespace-nowrap">Punta Mona</button>
            </div>

            <div id="group-lab" class="disco-group hidden">
                <div class="section-divider">
                    <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">EL LAB</h3>
                    <div></div>
                </div>
                <div id="lab-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8"></div>
            </div>

            <div id="group-lux" class="disco-group hidden">
                <div class="section-divider">
                    <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">LUX</h3>
                    <div></div>
                </div>
                <div id="lux-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8"></div>
            </div>

            <div id="group-punta" class="disco-group hidden">
                <div class="section-divider">
                    <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">PUNTA MONA</h3>
                    <div></div>
                </div>
                <div id="punta-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8"></div>
            </div>
        </div>

        <div id="section-shows" class="hidden">
            <div class="section-divider">
                <h3 class="serif-title text-[var(--gold)] tracking-widest text-[10px] uppercase">Espectáculos en Vivo</h3>
                <div></div>
            </div>
            <div id="shows-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8"></div>
        </div>

        <div id="loading-placeholders" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8">
            <div class="shimmer h-[300px] md:h-[600px] rounded-lg opacity-10"></div>
            <div class="shimmer h-[300px] md:h-[600px] rounded-lg opacity-10"></div>
        </div>

        <div id="no-events" class="hidden text-center py-20">
            <p class="text-stone-500 serif-title text-xl tracking-widest uppercase">No hay eventos programados</p>
        </div>
    </main>

    <script type="module">
        import { supabaseEventos } from './supabase-eventos.js';

        // --- ANALÍTICA ---
        async function registrarActividad(tipo, nombre) {
            try {
                await supabaseEventos
                    .from('registros_actividad')
                    .insert([{ 
                        tipo_evento: tipo, 
                        nombre_negocio: nombre,
                        fecha: new Date().toISOString()
                    }]);
            } catch (err) {
                console.error("Error analítica:", err);
            }
        }

        // Registrar visita a la página
        registrarActividad('visita_cartelera', 'Cartelera Punto 506');

        window.trackEventClick = (lugar, titulo) => {
            registrarActividad('interes_evento', `${lugar} | ${titulo}`);
        };
        // -----------------

        window.currentTab = 'discotecas'; 

        window.switchTab = (tab) => {
            window.currentTab = tab;
            const secDiscotecas = document.getElementById('section-discotecas');
            const secShows = document.getElementById('section-shows');
            const btnDiscotecas = document.getElementById('tab-discotecas');
            const btnShows = document.getElementById('tab-shows');
            const noEvents = document.getElementById('no-events');

            if (tab === 'discotecas') {
                secDiscotecas.classList.remove('hidden');
                secShows.classList.add('hidden');
                btnDiscotecas.classList.add('active');
                btnShows.classList.remove('active');
                checkDiscotecasVisibility();
            } else {
                secDiscotecas.classList.add('hidden');
                secShows.classList.remove('hidden');
                btnDiscotecas.classList.remove('active');
                btnShows.classList.add('active');
                
                const showsGrid = document.getElementById('shows-grid');
                showsGrid.children.length > 0 ? noEvents.classList.add('hidden') : noEvents.classList.remove('hidden');
            }
        };

        window.filterDisco = (disco) => {
            const buttons = document.querySelectorAll('.sub-tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const groups = {
                lab: document.getElementById('group-lab'),
                lux: document.getElementById('group-lux'),
                punta: document.getElementById('group-punta')
            };

            Object.keys(groups).forEach(key => {
                const group = groups[key];
                if (disco === 'all' || disco === key) {
                    if (group.dataset.hasContent === "true") group.classList.remove('hidden');
                } else {
                    group.classList.add('hidden');
                }
            });
            checkDiscotecasVisibility();
        };

        function checkDiscotecasVisibility() {
            const noEvents = document.getElementById('no-events');
            const visibleGroups = document.querySelectorAll('.disco-group:not(.hidden)');
            visibleGroups.length > 0 ? noEvents.classList.add('hidden') : noEvents.classList.remove('hidden');
        }

        function createEventCard(evento) {
            const fechaObj = new Date(evento.fecha + 'T00:00:00');
            const dia = fechaObj.getDate();
            const mes = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).toUpperCase();

            const card = document.createElement('div');
            card.className = 'event-poster rounded-xl group';
            card.innerHTML = `
                <div class="poster-wrapper relative">
                    <img src="${evento.imagen_url}" alt="${evento.titulo}" loading="lazy">
                    <div class="absolute top-0 left-2 md:left-4 z-20">
                        <div class="ticket-date px-2 py-3 md:px-3 md:py-4 text-center min-w-[40px] md:min-w-[50px] font-black shadow-2xl">
                            <span class="block text-lg md:text-xl leading-none">${dia}</span>
                            <span class="text-[8px] md:text-[10px] tracking-tighter">${mes}</span>
                        </div>
                    </div>
                </div>
                <div class="p-3 md:p-6 flex flex-col flex-grow bg-[#1c1817] border-t border-white/5">
                    <h3 class="serif-title text-sm md:text-xl text-white mb-2 leading-tight group-hover:text-[var(--gold)] transition-colors line-clamp-2">
                        ${evento.titulo}
                    </h3>
                    <div class="flex items-center gap-2 text-stone-400 text-[9px] md:text-xs mb-4 md:mb-6 font-light italic">
                        <svg class="w-2 h-2 md:w-3 md:h-3 text-[var(--gold)] shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                        </svg>
                        <span class="truncate">${evento.lugar}</span>
                    </div>
                    <div class="mt-auto">
                        <a href="${evento.link_contacto || '#'}" target="_blank" 
                           onclick="trackEventClick('${evento.lugar}', '${evento.titulo}')"
                           class="btn-gold block w-full text-center py-2 md:py-3 text-[8px] md:text-[10px] font-black tracking-[0.2em] md:tracking-[0.3em] uppercase rounded-sm shadow-lg">
                            INFORMACIÓN
                        </a>
                    </div>
                </div>
            `;
            return card;
        }

        async function cargarEventos() {
            const loaders = document.getElementById('loading-placeholders');
            const labGrid = document.getElementById('lab-grid');
            const luxGrid = document.getElementById('lux-grid');
            const puntaGrid = document.getElementById('punta-grid');
            const showsGrid = document.getElementById('shows-grid');

            try {
                const { data: eventos, error } = await supabaseEventos
                    .from('eventos')
                    .select('*')
                    .eq('aprobado', true)
                    .order('fecha', { ascending: true });

                if (error) throw error;
                loaders.classList.add('hidden');

                if (eventos && eventos.length > 0) {
                    eventos.forEach(evento => {
                        const card = createEventCard(evento);
                        const lugarNormalizado = evento.lugar.toUpperCase();

                        if (evento.es_discoteca) {
                            if (lugarNormalizado.includes('LAB')) {
                                labGrid.appendChild(card);
                                document.getElementById('group-lab').dataset.hasContent = "true";
                                document.getElementById('group-lab').classList.remove('hidden');
                            } else if (lugarNormalizado.includes('LUX')) {
                                luxGrid.appendChild(card);
                                document.getElementById('group-lux').dataset.hasContent = "true";
                                document.getElementById('group-lux').classList.remove('hidden');
                            } else if (lugarNormalizado.includes('PUNTA MONA')) {
                                puntaGrid.appendChild(card);
                                document.getElementById('group-punta').dataset.hasContent = "true";
                                document.getElementById('group-punta').classList.remove('hidden');
                            }
                        } else {
                            showsGrid.appendChild(card);
                        }
                    });
                }

                switchTab(window.currentTab);

            } catch (err) {
                console.error("Error:", err);
                loaders.innerHTML = `<p class="text-[var(--gold)] col-span-full text-center text-[10px] tracking-[0.4em]">ERROR DE CONEXIÓN</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
