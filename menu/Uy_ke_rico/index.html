<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Uy Ke Rico | Punto 506 Guápiles</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Identidad Visual Uy Ke Rico: Negro, Naranja Fuego y Rojo */
        body { background-color: #0c0a09; color: #fafaf9; font-family: 'Oswald', sans-serif; }
        .logo-font { font-family: 'Bangers', cursive; color: #f57c00; letter-spacing: 2px; }
        .bg-fire { background: linear-gradient(135deg, #f57c00 0%, #b71c1c 100%); }
        .border-fire { border-color: #f57c00; }
        .text-fire { color: #f57c00; }

        /* Estilos de la Interfaz */
        #slider-container { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 300px; position: relative; }
        .slide-overlay { background: linear-gradient(transparent, rgba(12,10,9,0.9)); }
        
        .btn-closed { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }
        .status-badge { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body class="pb-24">

    <div class="relative overflow-hidden border-b-4 border-fire">
        <div id="slider-container">
            </div>
        <div class="absolute inset-0 slide-overlay pointer-events-none"></div>
        
        <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20">
            <div class="bg-black p-2 rounded-full border-2 border-fire shadow-xl">
                <img src="logo.png" alt="Uy Ke Rico Logo" class="w-16 h-16 object-contain">
            </div>
        </div>
    </div>

    <header class="py-8 px-6 text-center">
        <h1 class="logo-font text-5xl uppercase italic drop-shadow-md">Uy Ke Rico!</h1>
        <p class="text-[10px] tracking-[0.3em] uppercase text-stone-400 mt-1">Fast Food & Grill • Guápiles</p>
        
        <div class="mt-4 flex justify-center">
            <span id="business-status" class="status-badge bg-stone-800 text-stone-400">Verificando...</span>
        </div>
    </header>

    <main id="menu-container" class="max-w-2xl mx-auto px-4 space-y-12"></main>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-[#1c1917] border-t-2 border-fire p-4 translate-y-full transition-transform z-40 shadow-2xl">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <p id="cart-count" class="text-[10px] font-bold text-fire uppercase">0 Productos</p>
                <p id="cart-total" class="text-2xl font-bold">₡0</p>
            </div>
            <button onclick="toggleCartModal(true)" class="bg-fire text-white px-8 py-3 rounded-lg font-bold uppercase text-sm transform active:scale-95 transition-all">
                Ver Mi Pedido
            </button>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/98 z-50 translate-y-full transition-transform duration-500 flex flex-col">
        <div class="p-6 border-b border-fire/20 flex justify-between items-center">
            <h2 class="logo-font text-2xl">Tu Pedido</h2>
            <button onclick="toggleCartModal(false)" class="text-fire font-bold">VOLVER</button>
        </div>
        
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4 font-sans"></div>

        <div class="p-6 bg-stone-900">
            <textarea id="order-notes" placeholder="¿Alguna instrucción especial? (ej. Sin cebolla)" class="w-full bg-black border border-stone-700 rounded-lg p-3 text-sm focus:border-fire outline-none mb-4 h-20 font-sans"></textarea>
            <div class="flex justify-between items-center mb-6 px-2">
                <span class="uppercase text-xs font-bold text-stone-400">Total a pagar:</span>
                <span id="modal-total" class="text-3xl font-bold text-fire">₡0</span>
            </div>
            <button id="btn-enviar-final" onclick="enviarPedido()" class="w-full bg-fire py-5 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all">
                CONFIRMAR POR WHATSAPP
            </button>
        </div>
    </div>

    <script src="productos.js"></script>
    <script>
        const CONFIG = {
            nombre: "Uy Ke Rico",
            whatsapp: "50689537426",
            fotos: [
                { url: 'papas.webp', t: 'Las Mejores Papas' },
                { url: 'costilla.webp', t: 'Costillas BBQ' },
                { url: 'hamburguesa.webp', t: 'Smash Burgers' }
            ]
        };

        // Horario basado en tus imágenes: Jue-Sáb, 6PM-10PM
        const HORARIO = { apertura: 18, cierre: 22, dias: [4, 5, 6] };
        let carrito = [];

        function inicializar() {
            renderSlider();
            renderMenu();
            setInterval(checkStatus, 10000);
            checkStatus();
        }

        function checkStatus() {
            const now = new Date();
            const isOpen = HORARIO.dias.includes(now.getDay()) && 
                           now.getHours() >= HORARIO.apertura && 
                           now.getHours() < HORARIO.cierre;
            
            const badge = document.getElementById('business-status');
            const btn = document.getElementById('btn-enviar-final');

            if(isOpen) {
                badge.innerText = "Abierto ahora";
                badge.className = "status-badge bg-green-900 text-green-400";
                btn.classList.remove('btn-closed');
            } else {
                badge.innerHTML = "Cerrado • Abre Jue, Vie y Sáb a las 6:00 PM";
                badge.className = "status-badge bg-red-900/30 text-red-500";
                btn.classList.add('btn-closed');
            }
            return isOpen;
        }

        function renderSlider() {
            document.getElementById('slider-container').innerHTML = CONFIG.fotos.map(f => `
                <div class="slide">
                    <img src="${f.url}" class="w-full h-full object-cover">
                    <div class="absolute bottom-4 left-6 z-10">
                        <h3 class="logo-font text-3xl text-white drop-shadow-lg">${f.t}</h3>
                    </div>
                </div>
            `).join('');
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            if (typeof MENU_DATA !== 'undefined') {
                container.innerHTML = MENU_DATA.map(cat => `
                    <section>
                        <h2 class="logo-font text-2xl mb-6 border-b-2 border-fire/30 inline-block pr-8 uppercase">${cat.categoria}</h2>
                        <div class="space-y-4">
                            ${cat.items.map(item => `
                                <div class="bg-stone-900/50 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                                    <div class="flex-1 pr-4">
                                        <h4 class="font-bold text-lg uppercase tracking-tight">${item.nombre}</h4>
                                        <p class="text-stone-500 text-xs font-sans mt-1 line-clamp-2">${item.desc}</p>
                                        <span class="text-fire font-bold text-xl block mt-1">₡${item.precio.toLocaleString()}</span>
                                    </div>
                                    <button onclick="addToCart(${item.id})" class="bg-stone-800 text-fire w-12 h-12 rounded-xl flex items-center justify-center active:bg-fire active:text-white transition-all">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3"/></svg>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `).join('');
            }
        }

        function addToCart(id) {
            let item;
            MENU_DATA.forEach(c => {
                let found = c.items.find(i => i.id === id);
                if(found) item = { ...found, cartId: Date.now() };
            });
            if(item) {
                carrito.push(item);
                updateUI();
                // Animación simple de feedback
                const bar = document.getElementById('cart-bar');
                bar.classList.add('scale-105');
                setTimeout(() => bar.classList.remove('scale-105'), 200);
            }
        }

        function updateUI() {
            const total = carrito.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-bar').classList.toggle('translate-y-full', carrito.length === 0);
            document.getElementById('cart-count').innerText = `${carrito.length} ${carrito.length === 1 ? 'ARTÍCULO' : 'ARTÍCULOS'}`;
            document.getElementById('cart-total').innerText = `₡${total.toLocaleString()}`;
            document.getElementById('modal-total').innerText = `₡${total.toLocaleString()}`;
            
            // Agrupar para el modal
            const groups = carrito.reduce((acc, i) => {
                acc[i.nombre] = (acc[i.nombre] || { c: 0, p: i.precio });
                acc[i.nombre].c++;
                return acc;
            }, {});

            document.getElementById('cart-items-list').innerHTML = Object.keys(groups).map(name => `
                <div class="flex justify-between items-center bg-stone-900 p-4 rounded-xl border border-white/5">
                    <div>
                        <p class="font-bold text-white uppercase">${groups[name].c}x ${name}</p>
                        <p class="text-fire text-sm">₡${(groups[name].c * groups[name].p).toLocaleString()}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="removeFromCart('${name}')" class="text-stone-500 p-2">Eliminar</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-stone-600 uppercase py-10">Tu pedido está vacío</p>';
        }

        function removeFromCart(name) {
            carrito = carrito.filter(i => i.nombre !== name);
            updateUI();
            if(carrito.length === 0) toggleCartModal(false);
        }

        function toggleCartModal(show) {
            document.getElementById('cart-modal').style.transform = show ? 'translateY(0%)' : 'translateY(100%)';
        }

        function enviarPedido() {
            if(!checkStatus()) { alert("¡Uy! Ahorita estamos cerrados. Abrimos de Jueves a Sábado a las 6:00 PM."); return; }
            if(carrito.length === 0) return;

            const total = carrito.reduce((s, i) => s + i.precio, 0);
            const notas = document.getElementById('order-notes').value;
            let msg = `*¡Hola Uy Ke Rico!* 🍔🔥\nQuiero hacer este pedido:\n\n`;
            
            const resumen = carrito.reduce((acc, i) => { acc[i.nombre] = (acc[i.nombre] || 0) + 1; return acc; }, {});
            for(let p in resumen) msg += `✅ *${resumen[p]}x* ${p}\n`;
            
            if(notas) msg += `\n*Notas:* _${notas}_`;
            msg += `\n\n💰 *Total: ₡${total.toLocaleString()}*`;
            
            window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = inicializar;
    </script>
</body>
</html>
