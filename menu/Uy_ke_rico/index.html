<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital Uy Ke Rico | Punto 506 Guápiles</title>
    <meta name="description" content="Hacé tu pedido en línea en Uy Ke Rico a través de Punto 506. Menú actualizado de hamburguesas, papas y más con envío directo a WhatsApp.">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SCCTHXBBP7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SCCTHXBBP7');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILO BASE UY KE RICO --- */
        body { 
            background-color: #0c0c0c; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            position: relative;
        }

        /* Fondo con imagen fondouy.webp */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('fondouy.webp'); 
            background-size: cover;
            background-position: center;
            opacity: 0.12; /* Ajusta la transparencia aquí */
            z-index: -1;
            pointer-events: none;
        }

        /* Paleta de colores Logo: Naranja y Fuego */
        .serif-title { font-family: 'Cinzel', serif; color: #ff6b00; } 
        .bg-fire { background-color: #ff6b00; }
        .border-fire { border-color: #ff6b00; }
        .text-fire { color: #ff6b00; }
        
        #slider-container { display: flex; transition: transform 0.7s ease-in-out; }
        
        .slide { min-width: 100%; position: relative; height: 350px; }
        @media (min-width: 768px) { .slide { height: 55vh; } }
        
        .slide-caption-bg {
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
        }

        .btn-closed { background-color: #222 !important; color: #555 !important; cursor: not-allowed !important; border-color: transparent !important; }
        
        /* Tarjetas Estilo Street Food */
        .item-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 107, 0, 0.15);
            transition: all 0.3s ease;
        }
        .item-card:hover {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.05);
        }

        /* Modal Oscuro y Pro */
        #cart-modal {
            background-color: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="pb-32">

    <div class="relative w-full overflow-hidden bg-black border-b border-fire/30">
        <div id="slider-container"></div>
        <button onclick="moveSlider(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/50 backdrop-blur-sm text-white w-10 h-10 flex items-center justify-center rounded-full z-20 hover:bg-fire">❮</button>
        <button onclick="moveSlider(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/50 backdrop-blur-sm text-white w-10 h-10 flex items-center justify-center rounded-full z-20 hover:bg-fire">❯</button>
    </div>

    <header class="py-12 text-center border-b border-fire/20 bg-black/40 relative">
        <button onclick="window.location.href='https://punto506.montzucr.com'" class="absolute left-6 top-6 flex items-center gap-2 text-fire/70 hover:text-fire transition-colors group">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="text-[11px] uppercase tracking-widest font-black">Directorio</span>
        </button>

        <h1 id="store-name" class="serif-title text-4xl md:text-6xl tracking-[0.15em] uppercase mt-4">UY KE RICO</h1>
        <p id="business-status" class="text-[10px] tracking-[0.3em] mt-3 uppercase font-bold text-slate-400">Verificando horario...</p>
    </header>

    <main id="menu-container" class="max-w-md md:max-w-6xl mx-auto px-6 mt-12 space-y-16"></main>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-black border-t border-fire/40 p-5 transform translate-y-full transition-transform duration-300 shadow-[0_-15px_30px_rgba(0,0,0,0.8)] z-40">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-4">
                <span id="cart-count" class="text-[11px] text-fire font-black uppercase tracking-tighter">0 ITEMS</span>
                <span id="cart-total" class="text-2xl font-black text-white">₡0</span>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleCartModal(true)" class="flex-1 border-2 border-fire/50 text-fire py-3 font-black text-[11px] uppercase tracking-widest rounded-lg">Revisar</button>
                <button id="btn-enviar-main" onclick="enviarPedido()" class="flex-[2] bg-fire text-black py-3 font-black text-[11px] uppercase tracking-widest rounded-lg shadow-lg shadow-fire/20">Pedir por WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 z-50 transition-transform duration-500 translate-y-full flex flex-col">
        <div class="p-6 border-b border-fire/20 flex justify-between items-center">
            <h2 class="serif-title text-xl uppercase">Mi Pedido</h2>
            <button onclick="toggleCartModal(false)" class="text-fire font-black uppercase text-xs">Cerrar</button>
        </div>
        <div id="cart-items-list" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 bg-black/40 border-t border-fire/10">
            <textarea id="order-notes" placeholder="¿Algún cambio? (Ej. Sin cebolla...)" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-sm focus:border-fire focus:outline-none text-white" rows="2"></textarea>
            <div class="flex justify-between mt-6 mb-4">
                <span class="text-slate-400 uppercase text-xs font-bold">Total a pagar</span>
                <span id="modal-total" class="text-fire text-xl font-black">₡0</span>
            </div>
            <button id="btn-enviar-modal" onclick="enviarPedido()" class="w-full bg-fire text-black py-5 font-black text-sm uppercase tracking-widest rounded-xl">Confirmar Pedido</button>
        </div>
    </div>

    <script src="productos.js"></script>
    <script>
        const CONFIG = {
            nombreNegocio: "Uy Ke Rico",
            whatsapp: "50689537426",
            fotosSlider: [
                { url: 'papas.webp', nombre: 'Papas Especiales' },
                { url: 'costilla.webp', nombre: 'Costillas BBQ' },
                { url: 'combo1.webp', nombre: 'Combos Street' }
            ]
        };

        const HORARIO = { apertura: 18, cierre: 22, diasPermitidos: [4, 5, 6] };
        let currentSlide = 0;
        let carrito = [];

        function inicializar() {
            renderSlider();
            renderMenu();
            verificarHorario();
        }

        function verificarHorario() {
            const ahora = new Date();
            const horaActual = ahora.getHours();
            const diaActual = ahora.getDay(); 
            const esDiaAbierto = HORARIO.diasPermitidos.includes(diaActual);
            const esHoraAbierta = horaActual >= HORARIO.apertura && horaActual < HORARIO.cierre;
            const estaAbierto = esDiaAbierto && esHoraAbierta;
            
            const statusLabel = document.getElementById('business-status');
            const btns = [document.getElementById('btn-enviar-main'), document.getElementById('btn-enviar-modal')];

            if (estaAbierto) {
                statusLabel.innerText = "• Abierto Ahora •";
                statusLabel.style.color = "#22c55e";
                btns.forEach(b => { b.classList.remove('btn-closed'); b.disabled = false; });
            } else {
                statusLabel.innerHTML = "Cerrado <br> <span class='text-[8px]'>Abrimos Jueves a Sábados de 6 PM a 10 PM</span>";
                statusLabel.style.color = "#ef4444";
                btns.forEach(b => { b.classList.add('btn-closed'); b.disabled = true; b.innerText = "Cerrado"; });
            }
            return estaAbierto;
        }

        function renderSlider() {
            const slider = document.getElementById('slider-container');
            slider.innerHTML = CONFIG.fotosSlider.map(foto => `
                <div class="slide">
                    <img src="${foto.url}" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 left-0 w-full p-10 slide-caption-bg">
                        <span class="text-fire font-black text-[10px] uppercase tracking-[0.4em]">Uy Ke Rico</span>
                        <h3 class="serif-title text-3xl text-white mt-1 uppercase">${foto.nombre}</h3>
                    </div>
                </div>
            `).join('');
        }

        function moveSlider(direction) {
            const slider = document.getElementById('slider-container');
            currentSlide = (currentSlide + direction + CONFIG.fotosSlider.length) % CONFIG.fotosSlider.length;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        setInterval(() => moveSlider(1), 5000);

        function renderMenu() {
            const container = document.getElementById('menu-container');
            if (typeof MENU_DATA !== 'undefined') {
                container.innerHTML = "";
                MENU_DATA.forEach(cat => {
                    let html = `<section>
                        <h2 class="serif-title text-lg tracking-[0.2em] mb-8 border-l-4 border-fire pl-4 uppercase font-black">${cat.categoria}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                    
                    cat.items.forEach(item => {
                        html += `
                            <div class="item-card flex justify-between items-center p-5 rounded-2xl shadow-xl">
                                <div class="flex-1 pr-4">
                                    <h3 class="text-white font-black text-sm uppercase tracking-tight">${item.nombre}</h3>
                                    <p class="text-slate-400 text-[11px] mt-1 leading-snug">${item.desc}</p>
                                    <span class="text-fire font-black text-lg block mt-2">₡${item.precio.toLocaleString()}</span>
                                </div>
                                <button onclick="agregarAlCarrito(${item.id})" class="bg-fire/10 border border-fire/30 text-fire p-3 rounded-xl hover:bg-fire hover:text-black transition-all active:scale-95">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3"/></svg>
                                </button>
                            </div>`;
                    });
                    html += `</div></section>`;
                    container.innerHTML += html;
                });
            }
        }

        function agregarAlCarrito(id) {
            let item;
            MENU_DATA.forEach(c => {
                let found = c.items.find(i => i.id === id);
                if(found) item = { ...found, cartId: Date.now() };
            });
            if(item) { carrito.push(item); actualizarUI(); }
        }

        function sumarItem(nombre) {
            const item = carrito.find(i => i.nombre === nombre);
            if(item) { carrito.push({ ...item, cartId: Date.now() }); actualizarUI(); }
        }

        function restarItem(nombre) {
            const index = carrito.findLastIndex(item => item.nombre === nombre);
            if (index !== -1) { carrito.splice(index, 1); actualizarUI(); }
            if(carrito.length === 0) toggleCartModal(false);
        }

        function eliminarDelCarrito(nombre) {
            carrito = carrito.filter(item => item.nombre !== nombre);
            actualizarUI();
            if(carrito.length === 0) toggleCartModal(false);
        }

        function toggleCartModal(show) {
            document.getElementById('cart-modal').style.transform = show ? 'translateY(0%)' : 'translateY(100%)';
        }

        function actualizarUI() {
            const bar = document.getElementById('cart-bar');
            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            
            if(carrito.length > 0) bar.classList.remove('translate-y-full');
            else bar.classList.add('translate-y-full');

            document.getElementById('cart-count').innerText = `${carrito.length} PRODUCTOS`;
            document.getElementById('cart-total').innerText = `₡${total.toLocaleString()}`;
            document.getElementById('modal-total').innerText = `₡${total.toLocaleString()}`;

            const resumen = {};
            carrito.forEach(item => {
                if (!resumen[item.nombre]) resumen[item.nombre] = { cantidad: 0, precioUnitario: item.precio };
                resumen[item.nombre].cantidad++;
            });

            const list = document.getElementById('cart-items-list');
            list.innerHTML = Object.keys(resumen).map(nombre => `
                <div class="flex justify-between items-center bg-white/5 p-5 rounded-2xl border border-white/5 shadow-inner">
                    <div class="flex-1">
                        <h4 class="text-white text-xs font-black uppercase">${nombre}</h4>
                        <p class="text-fire text-xs font-bold">₡${(resumen[nombre].cantidad * resumen[nombre].precioUnitario).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center bg-black rounded-lg border border-fire/20">
                            <button onclick="restarItem('${nombre}')" class="w-8 h-8 text-fire hover:bg-fire hover:text-black transition-colors">-</button>
                            <span class="w-8 text-center text-xs font-black">${resumen[nombre].cantidad}</span>
                            <button onclick="sumarItem('${nombre}')" class="w-8 h-8 text-fire hover:bg-fire hover:text-black transition-colors">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function enviarPedido() {
            if (!verificarHorario()) { alert("El local está cerrado actualmente."); return; }
            if (carrito.length === 0) return;

            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            const notas = document.getElementById('order-notes').value;
            let texto = `¡Hola Uy Ke Rico! 🍔 Quiero pedir:\n\n`;
            
            const resumen = {};
            carrito.forEach(i => resumen[i.nombre] = (resumen[i.nombre] || 0) + 1);
            for(let prod in resumen) texto += `🔥 *${resumen[prod]}x* ${prod}\n`;
            
            if(notas.trim() !== "") texto += `\n📝 *Notas:* _${notas}_\n`;
            texto += `\n💰 *Total: ₡${total.toLocaleString()}*`;
            
            window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
        }

        window.onload = inicializar;
    </script>
</body>
</html>
