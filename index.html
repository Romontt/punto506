<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS | Pococí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-axis-dark { background-color: #0f172a; }
        .text-axis-gold { color: #fbbf24; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <header class="bg-axis-dark text-white py-12 px-6 text-center border-b-4 border-fbbf24">
        <h1 class="serif text-5xl md:text-7xl mb-2 tracking-tighter">AXIS</h1>
        <p class="text-axis-gold uppercase tracking-[0.2em] text-sm font-light">Curaduría de Excelencia • Pococí</p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div id="contenedor-negocios" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-center col-span-full py-20 text-slate-400">Cargando experiencias...</p>
        </div>
    </main>

    <script>
        // Función para cargar los negocios desde el JSON
        async function cargarNegocios() {
            try {
                const respuesta = await fetch('negocios.json');
                const negocios = await respuesta.json();
                const contenedor = document.getElementById('contenedor-negocios');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                negocios.forEach(negocio => {
                    const card = `
                        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition group">
                            <div class="h-48 bg-slate-200 overflow-hidden">
                                <div class="w-full h-full bg-cover bg-center group-hover:scale-105 transition duration-500" style="background-image: url('${negocio.imagen}')"></div>
                            </div>
                            <div class="p-6">
                                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">${negocio.categoria}</span>
                                <h3 class="serif text-2xl mt-1 mb-2">${negocio.nombre}</h3>
                                <p class="text-slate-600 text-sm mb-4 italic">"${negocio.gancho}"</p>
                                <div class="flex flex-wrap gap-2 mb-6">
                                    ${negocio.tags.map(tag => `<span class="text-[10px] bg-slate-100 px-2 py-1 rounded">#${tag}</span>`).join('')}
                                </div>
                                <a href="https://wa.me/${negocio.whatsapp}" class="block text-center py-3 bg-axis-dark text-white rounded-lg hover:bg-slate-800 transition font-bold text-sm">Contactar</a>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                console.error('Error cargando los negocios:', error);
            }
        }

        cargarNegocios();
    </script>

    <footer class="mt-20 py-10 bg-slate-100 text-center border-t border-slate-200">
        <h2 class="font-bold text-slate-800 tracking-tighter uppercase">MontZu CR</h2>
    </footer>
</body>
</html>
