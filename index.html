<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 506 | Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'p506-gold': '#d4a373',
                        'p506-dark': '#0a0908',
                        'p506-bronze': '#bc8a5f',
                    },
                    fontFamily: {
                        'serif-title': ['Cinzel', 'serif'],
                        'sans-body': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .serif-title { font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.2em; }
        body { background: radial-gradient(circle at top center, #1c1917 0%, #0a0908 100%); }
        .text-gradient {
            background: linear-gradient(to bottom, #fef3c7 0%, #d4a373 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .opcion-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(212, 163, 115, 0.15);
            position: relative;
            overflow: hidden;
        }
        .opcion-card:hover {
            border-color: rgba(212, 163, 115, 0.6);
            background: rgba(212, 163, 115, 0.08);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7);
        }
        .logo-glow { box-shadow: 0 0 40px rgba(212, 163, 115, 0.15); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeInUp 0.8s ease forwards; opacity: 0; }

        .custom-logo-circle {
            background: conic-gradient(
                #2a2420 0deg 45deg, 
                #1a1614 45deg 90deg, 
                #2a2420 90deg 135deg, 
                #1a1614 135deg 180deg, 
                #2a2420 180deg 225deg, 
                #1a1614 225deg 270deg, 
                #2a2420 270deg 315deg, 
                #1a1614 315deg 360deg
            );
            border: 1px solid rgba(212, 163, 115, 0.3);
        }
    </style>
</head>
<body class="bg-p506-dark text-stone-300 min-h-screen flex flex-col items-center justify-center p-4 md:p-6 selection:bg-p506-gold">

    <header class="text-center mb-10 md:mb-20">
        <div class="flex flex-col items-center mb-6 md:mb-8 group">
            <div class="w-24 h-24 md:w-32 md:h-32 rounded-full flex items-center justify-center custom-logo-circle logo-glow backdrop-blur-sm relative mb-4">
                <div class="absolute inset-0 rounded-full border border-p506-gold/20 animate-ping group-hover:animate-none"></div>
                <span class="serif-title text-3xl md:text-4xl text-p506-gold font-bold z-10 drop-shadow-lg">506</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-p506-gold text-[7px] md:text-[9px] tracking-[0.4em] font-black uppercase opacity-90">Punto 506</span>
                <span class="text-p506-gold/30 font-light">|</span>
                <span class="text-p506-gold/60 text-[6px] md:text-[8px] tracking-[0.3em] font-bold uppercase">BY MONTZU CR</span>
            </div>
        </div>

        <h1 class="serif-title text-3xl md:text-7xl mb-2 md:mb-4 font-bold tracking-[0.2em] md:tracking-[0.3em] text-gradient">Punto 506</h1>
        <div class="flex items-center justify-center gap-2 md:gap-4 font-sans-body">
            <div class="h-[1px] w-6 md:w-12 bg-gradient-to-r from-transparent to-p506-gold/50"></div>
            <p class="text-p506-gold text-[8px] md:text-xs uppercase tracking-[0.3em] md:tracking-[0.6em] font-medium opacity-80">Descubre • Conecta • Destaca</p>
            <div class="h-[1px] w-6 md:w-12 bg-gradient-to-l from-transparent to-p506-gold/50"></div>
        </div>
    </header>

    <nav class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 max-w-6xl w-full">
        
        <a href="/directorio" onclick="trackClick(event, 'Punto 506 - Directorio')" class="opcion-card bg-stone-900/20 backdrop-blur-xl p-6 md:p-12 rounded-2xl md:rounded-3xl text-center group animate-card" style="animation-delay: 0.1s;">
            <div class="text-3xl md:text-5xl mb-4 md:mb-8 group-hover:scale-110 transition-transform duration-500">🔍</div>
            <h2 class="serif-title text-[10px] md:text-sm text-white mb-2 tracking-widest group-hover:text-p506-gold">Directorio</h2>
            <div class="h-[1px] w-6 md:w-8 bg-p506-gold/20 mx-auto"></div>
            <p class="mt-3 text-stone-500 text-[8px] md:text-[9px] uppercase tracking-widest font-semibold">Comercios locales</p>
        </a>

        <a href="/entrevistas" onclick="trackClick(event, 'Punto 506 - Entrevistas')" class="opcion-card bg-stone-900/20 backdrop-blur-xl p-6 md:p-12 rounded-2xl md:rounded-3xl text-center group animate-card" style="animation-delay: 0.2s;">
            <div class="text-3xl md:text-5xl mb-4 md:mb-8 group-hover:scale-110 transition-transform duration-500">🎙️</div>
            <h2 class="serif-title text-[10px] md:text-sm text-white mb-2 tracking-widest group-hover:text-p506-gold">Entrevistas</h2>
            <div class="h-[1px] w-6 md:w-8 bg-p506-gold/20 mx-auto"></div>
            <p class="mt-3 text-stone-500 text-[8px] md:text-[9px] uppercase tracking-widest font-semibold">Historias de Pococí</p>
        </a>

        <a href="/empleos/be.html" onclick="trackClick(event, 'Punto 506 - Empleos')" class="opcion-card bg-stone-900/20 backdrop-blur-xl p-6 md:p-12 rounded-2xl md:rounded-3xl text-center group animate-card" style="animation-delay: 0.3s;">
            <div class="text-3xl md:text-5xl mb-4 md:mb-8 group-hover:scale-110 transition-transform duration-500">💼</div>
            <h2 class="serif-title text-[10px] md:text-sm text-white mb-2 tracking-widest group-hover:text-p506-gold">Empleos</h2>
            <div class="h-[1px] w-6 md:w-8 bg-p506-gold/20 mx-auto"></div>
            <p class="mt-3 text-stone-500 text-[8px] md:text-[9px] uppercase tracking-widest font-semibold">Oportunidades</p>
        </a>

        <a href="/eventos" onclick="trackClick(event, 'Punto 506 - Eventos')" class="opcion-card bg-p506-gold/[0.03] backdrop-blur-xl p-6 md:p-12 rounded-2xl md:rounded-3xl text-center group animate-card border-p506-gold/40" style="animation-delay: 0.4s;">
            <div class="absolute top-2 right-2 md:top-4 md:right-4 bg-p506-gold text-black text-[6px] md:text-[7px] px-2 md:px-3 py-0.5 md:py-1 font-black uppercase tracking-widest rounded-full">New</div>
            <div class="text-3xl md:text-5xl mb-4 md:mb-8 group-hover:scale-110 transition-transform duration-500">🎭</div>
            <h2 class="serif-title text-[10px] md:text-sm text-p506-gold mb-2 tracking-widest font-bold">Eventos</h2>
            <div class="h-[1px] w-8 md:w-12 bg-p506-gold mx-auto"></div>
            <p class="mt-3 text-p506-gold/60 text-[8px] md:text-[9px] uppercase tracking-widest font-semibold">Cartelera Local</p>
        </a>

    </nav>

    <footer class="mt-12 md:mt-24 text-center">
        <div class="opacity-30">
            <p class="text-[8px] md:text-[10px] uppercase tracking-[0.3em] serif-title mb-1 md:mb-2">Pococí • Limón • Costa Rica</p>
            <p class="text-[7px] md:text-[8px] uppercase tracking-[0.2em] font-light">© 2026 Crafted by MontZu</p>
        </div>
    </footer>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://yfqxnjohojtbjevrmbmq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmcXhuam9ob2p0YmpldnJtYm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjI4ODgsImV4cCI6MjA4ODM5ODg4OH0.ze32GU0sW7EZ5oicnLFlHpthtLcSTUxZ9rlHSyQLFso';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Registrar visita al cargar
        async function registrarVisita() {
            await supabase.from('analitica').insert([
                { tipo_evento: 'visita_pagina', nombre_negocio: 'Punto 506 - Inicio' }
            ]);
        }

        // Registrar clic y redirigir
        async function trackClick(event, nombre) {
            event.preventDefault(); // Detenemos el enlace un momento
            const href = event.currentTarget.getAttribute('href');
            
            try {
                await supabase.from('analitica').insert([
                    { tipo_evento: 'click_opcion', nombre_negocio: nombre }
                ]);
            } catch (err) {
                console.error("Error tracking click", err);
            } finally {
                window.location.href = href; // Redirigimos pase lo que pase
            }
        }

        document.addEventListener('DOMContentLoaded', registrarVisita);
    </script>
</body>
</html>
