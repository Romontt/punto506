<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS | Pococí Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --axis-blue: #0f172a;
            --axis-gold: #c29d5b;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .serif-title { font-family: 'Cinzel', serif; }
        .bg-axis-blue { background-color: var(--axis-blue); }
        .text-axis-gold { color: var(--axis-gold); }
        .border-axis-gold { border-color: var(--axis-gold); }
        
        /* Efecto de degradado sutil para el fondo del hero */
        .hero-overlay {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95));
        }
    </style>
</head>
<body>

    <header class="relative h-[60vh] flex items-center justify-center text-white overflow-hidden">
        <img src="https://images.unsplash.com/photo-1594914141274-783f8cbdb6a2?auto=format&fit=crop&q=80&w=1600" 
             class="absolute inset-0 w-full h-full object-cover" alt="Paisaje Pococí">
        <div class="absolute inset-0 hero-overlay"></div>

        <div class="relative z-10 text-center px-4">
            <div class="mb-6 flex justify-center">
                <div class="w-24 h-24 border-2 border-axis-gold rounded-full flex items-center justify-center p-2 bg-slate-900/50 backdrop-blur-sm">
                    <span class="serif-title text-4xl text-axis-gold">A</span>
                </div>
            </div>
            <h1 class="serif-title text-5xl md:text-7xl tracking-[0.2em] mb-2">AXIS</h1>
            <p class="text-axis-gold uppercase tracking-[0.3em] text-xs md:text-sm font-light mb-8 italic">
                Discover. Connect. Excel.
            </p>
            <div class="max-w-xl mx-auto relative">
                <input type="text" placeholder="Buscar experiencias en Pococí..." 
                       class="w-full py-4 px-6 rounded-full bg-white/10 border border-white/20 backdrop-blur-md text-white placeholder:text-gray-400 focus:outline-none focus:border-axis-gold transition">
            </div>
        </div>
    </header>

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-around py-4 overflow-x-auto text-[10px] uppercase tracking-widest font-bold text-slate-500">
            <button class="hover:text-axis-gold transition px-4 border-b-2 border-transparent hover:border-axis-gold pb-1 text-axis-gold border-axis-gold">Todos</button>
            <button class="hover:text-axis-gold transition px-4 border-b-2 border-transparent hover:border-axis-gold pb-1 text-slate-900">Salud</button>
            <button class="hover:text-axis-gold transition px-4 border-b-2 border-transparent hover:border-axis-gold pb-1">Gastronomía</button>
            <button class="hover:text-axis-gold transition px-4 border-b-2 border-transparent hover:border-axis-gold pb-1">Estética</button>
            <button class="hover:text-axis-gold transition px-4 border-b-2 border-transparent hover:border-axis-gold pb-1 text-slate-900 font-bold">BY MONTZU CR</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-12 px-6">
        <h2 class="serif-title text-2xl mb-8 text-slate-800 border-l-4 border-axis-gold pl-4 uppercase tracking-widest">Experiencias Curadas</h2>
        
        <div id="grid-negocios" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <footer class="bg-axis-blue text-white py-16 px-6 border-t-4 border-axis-gold">
        <div class="max-w-4xl mx-auto text-center">
            <p class="text-[10px] tracking-[0.4em] uppercase text-gray-400 mb-4 font-bold">Un proyecto de excelencia</p>
            <h2 class="serif-title text-3xl md:text-4xl text-axis-gold tracking-widest mb-8">MONTZU CR</h2>
            <div class="h-[1px] w-20 bg-axis-gold mx-auto mb-8"></div>
            <p class="text-sm text-gray-500 font-light max-w-md mx-auto italic leading-relaxed">
                "Elevando el estándar de los servicios profesionales en la zona de Pococí."
            </p>
            <div class="mt-12 text-[9px] text-gray-600 tracking-widest">
                AXIS POCOCÍ &copy; 2026 | ALL RIGHTS RESERVED
            </div>
        </div>
    </footer>

    <script>
        async function loadAxisData() {
            try {
                const response = await fetch('negocios.json');
                const data = await response.json();
                const grid = document.getElementById('grid-negocios');
                
                grid.innerHTML = data.map(n => `
                    <div class="group bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-2xl transition duration-500 border border-slate-100">
                        <div class="relative h-64 overflow-hidden">
                            <img src="${n.imagen}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt="${n.nombre}">
                            <div class="absolute top-4 left-4 bg-axis-blue/90 text-axis-gold text-[10px] px-3 py-1 font-bold tracking-widest rounded uppercase">
                                ${n.categoria}
                            </div>
                        </div>
                        <div class="p-8 text-center">
                            <h3 class="serif-title text-xl text-slate-900 mb-3 uppercase tracking-tighter">${n.nombre}</h3>
                            <p class="text-slate-500 text-sm mb-6 font-light leading-relaxed italic">"${n.gancho}"</p>
                            <a href="https://wa.me/${n.whatsapp}" 
                               class="inline-block px-8 py-3 border border-axis-gold text-axis-gold text-xs font-bold uppercase tracking-widest hover:bg-axis-gold hover:text-white transition duration-300">
                                Explorar Detalles
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Error cargando AXIS data", e);
            }
        }
        loadAxisData();
    </script>
</body>
</html>
