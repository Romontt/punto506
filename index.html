<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Pococí Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --p506-dark: #080c14; --p506-gold: #c29d5b; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #080c14;
            /* AJUSTE: Gradiente más suave para que se vea la imagen de fondo */
            background-image: linear-gradient(to bottom, rgba(8, 12, 20, 0.85), rgba(15, 23, 42, 0.9)), 
                              url('https://images.unsplash.com/photo-1581330093717-b0882e340794?auto=format&fit=crop&q=80&w=1600');
            background-attachment: fixed; background-size: cover; background-position: center;
        }
        .serif-title { font-family: 'Cinzel', serif; }
        .business-title { font-family: 'Montserrat', sans-serif; }
        
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* Estilo de Tarjetas */
        .glass-card {
            background: rgba(30, 41, 59, 0.3);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(194, 157, 91, 0.1);
            transition: all 0.4s ease;
        }
        .glass-card:hover {
            border-color: var(--p506-gold);
            background: rgba(30, 41, 59, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #080c14; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c29d5b; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased text-slate-300">

    <header class="relative py-12 flex items-center justify-center text-white overflow-hidden border-b border-white/5">
        <img src="https://images.unsplash.com/photo-1541414779316-956a5084c0d4?auto=format&fit=crop&q=80&w=1600" class="absolute inset-0 w-full h-full object-cover opacity-40 scale-110" alt="Pococí">
        <div class="absolute inset-0 bg-gradient-to-b from-[#080c14]/20 via-[#080c14]/60 to-[#080c14]"></div>
        
        <div class="relative z-10 text-center px-4 w-full max-w-4xl animate-fade-in">
            <div class="mb-4 flex justify-center">
                <div class="w-12 h-12 border-2 border-[#c29d5b] rounded-full flex items-center justify-center bg-black/40 backdrop-blur-md shadow-[0_0_20px_rgba(194,157,91,0.2)]">
                    <span class="serif-title text-xl text-[#c29d5b] font-bold">506</span>
                </div>
            </div>
            <h1 class="serif-title text-3xl md:text-4xl tracking-[0.4em] mb-1 text-white uppercase font-black">Punto 506</h1>
            <p class="text-[#c29d5b] uppercase tracking-[0.5em] text-[8px] md:text-[9px] font-bold mb-8 opacity-80">Descubre. Conecta. Destaca.</p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="busqueda" placeholder="Busca una experiencia en Guápiles..." class="w-full py-2 px-8 rounded-full bg-white/5 border border-white/10 backdrop-blur-xl text-xs text-white placeholder:text-gray-500 focus:outline-none focus:border-[#c29d5b] transition-all">
            </div>
        </div>
    </header>
    
    <nav class="bg-[#080c14]/95 backdrop-blur-xl border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-center md:justify-around items-center py-6 overflow-x-auto gap-12 px-6 hide-scroll">
            <button data-cat="todos" class="filter-btn transition text-[11px] uppercase tracking-[0.3em] font-black text-[#c29d5b] border-b-2 border-[#c29d5b] pb-2 whitespace-nowrap">Todos</button>
            <button data-cat="salud" class="filter-btn transition text-[11px] uppercase tracking-[0.3em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Salud</button>
            <button data-cat="gastronomía" class="filter-btn transition text-[11px] uppercase tracking-[0.3em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Gastronomía</button>
            <button data-cat="estética" class="filter-btn transition text-[11px] uppercase tracking-[0.3em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Estética</button>
            <div class="hidden md:block h-4 w-[1px] bg-white/10"></div>
            <span class="hidden md:block text-[10px] uppercase tracking-[0.4em] font-black text-white/30">BY MONTZU CR</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-20 px-6">
        <div class="flex items-center gap-4 mb-16">
            <div class="h-[1px] w-12 bg-[#c29d5b]"></div>
            <h2 class="serif-title text-xl text-white uppercase tracking-[0.4em]">Recomendaciones</h2>
        </div>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="bg-[#0f172a] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl border border-white/10 shadow-2xl relative animate-fade-in custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-6 right-6 z-20 bg-black/40 backdrop-blur-xl rounded-full p-2 text-white hover:bg-[#c29d5b] transition">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-black py-16 px-6 border-t border-white/5">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-2xl text-[#c29d5b] tracking-widest uppercase">Punto 506</h2>
                <p class="text-[9px] uppercase text-gray-600 font-bold tracking-[0.3em]">Pococí Select</p>
            </div>
            <p class="text-[10px] text-gray-500 font-light italic max-w-[300px] text-center leading-relaxed">"Elevando el estándar de los servicios profesionales en la zona de Pococí."</p>
            <div class="text-center md:text-right">
                <p class="text-[8px] uppercase text-gray-600 mb-1 font-bold tracking-widest">Un proyecto de</p>
                <h3 class="serif-title text-sm text-white tracking-[0.3em]">MONTZU CR</h3>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="text-gray-500 text-center py-20 col-span-full uppercase text-[10px] tracking-widest font-bold">Iniciando Directorio...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.innerHTML = lista.map((n, i) => `
                <div class="group glass-card rounded-2xl overflow-hidden animate-fade-in" style="animation-delay: ${i*0.1}s">
                    <div class="relative h-60 overflow-hidden">
                        <img src="${n.imagen}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 group-hover:scale-110 transition duration-700" alt="${n.nombre}">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#080c14] via-transparent opacity-80"></div>
                        <div class="absolute top-4 left-4 bg-[#c29d5b] text-black text-[8px] px-2 py-1 font-black tracking-widest rounded-sm uppercase">${n.categoria}</div>
                    </div>
                    <div class="p-8 text-center">
                        <h3 class="business-title text-lg text-white mb-3 uppercase tracking-tighter">${n.nombre}</h3>
                        <p class="text-gray-400 text-[10px] mb-8 font-light uppercase tracking-[0.15em] h-10 line-clamp-2 leading-relaxed">${n.servicios_resumen}</p>
                        <button onclick="verDetalle(${n.id})" class="w-full py-3 border border-[#c29d5b]/40 text-[#c29d5b] text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-[#c29d5b] hover:text-black transition duration-500">Explorar Detalles</button>
                    </div>
                </div>
            `).join('');
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-72">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0f172a] via-transparent"></div>
                </div>
                <div class="p-10 -mt-12 relative z-10 bg-[#0f172a] rounded-t-[3rem]">
                    <span class="text-[#c29d5b] text-[10px] font-bold tracking-[0.5em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-3xl text-white mt-3 mb-6 uppercase tracking-wider font-bold">${n.nombre}</h2>
                    
                    <div class="bg-white/5 p-6 rounded-2xl mb-8 border border-white/5">
                         <h4 class="text-[9px] uppercase tracking-[0.3em] font-bold text-[#c29d5b] mb-3">Servicios Principales</h4>
                         <p class="text-gray-300 text-sm leading-relaxed">${n.servicios_resumen}</p>
                    </div>

                    <p class="text-gray-400 text-sm leading-relaxed mb-10 font-light italic border-l-2 border-[#c29d5b]/40 pl-6">
                        ${n.descripcion || 'Servicio de alta calidad seleccionado por Punto 506.'}
                    </p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-white/10 pt-8 mb-10">
                        <div>
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-[0.3em] block mb-2">Horario</span>
                            <span class="text-gray-400 text-xs">${n.horario}</span>
                        </div>
                        <div>
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-[0.3em] block mb-2">Ubicación</span>
                            <span class="text-gray-400 text-xs">${n.direccion}</span>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mb-10">
                        <a href="${n.instagram || '#'}" target="_blank" class="flex-1 text-center py-4 border border-white/20 text-white text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-white hover:text-black transition duration-300 rounded-xl">Instagram</a>
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="flex-[1.5] text-center py-4 bg-[#c29d5b] text-black text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-white transition duration-300 rounded-xl shadow-lg shadow-[#c29d5b]/10">WhatsApp Directo</a>
                    </div>

                    <div class="bg-black/40 p-8 rounded-3xl border border-dashed border-white/10 text-center">
                        <h4 class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-500 mb-2">Buzón de Mejora Privado</h4>
                        <p class="text-[10px] text-gray-400 mb-6 italic leading-relaxed">¿Cómo puede este local mejorar su servicio?</p>
                        <a href="${prefilledLink}" target="_blank" class="text-[10px] font-bold text-[#c29d5b] uppercase tracking-widest border-b border-[#c29d5b] pb-1 hover:text-white hover:border-white transition">Enviar Sugerencia para ${n.nombre}</a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // AJUSTE: Cerrar al tocar fuera del contenido del modal
        document.getElementById('modal-negocio').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t) ||
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                        b.classList.add('text-gray-500', 'border-transparent');
                    });
                    btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
