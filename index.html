<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Descubre. Conecta. Destaca.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p506-dark: #050a09; 
            --p506-green: #0a2e24;
            --p506-accent: #10b981; /* Verde Caribe */
            --p506-gold: #c29d5b; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--p506-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(194, 157, 91, 0.05) 0%, transparent 40%),
                linear-gradient(to bottom, #050a09, #0a2e24, #050a09);
            background-attachment: fixed;
        }
        .serif-title { font-family: 'Cinzel', serif; letter-spacing: 0.15em; }
        .business-title { font-family: 'Montserrat', sans-serif; letter-spacing: -0.01em; }
        
        @keyframes revealCard { 
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); } 
            to { opacity: 1; transform: translateY(0); filter: blur(0); } 
        }
        .animate-reveal { 
            opacity: 0;
            animation: revealCard 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; 
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.1);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-card:hover {
            border-color: var(--p506-accent);
            background: rgba(16, 185, 129, 0.05);
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .search-input {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 99px;
            transition: all 0.4s ease;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.05);
            border-color: var(--p506-accent);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
            outline: none;
        }

        .tropical-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5c2 0 5 2 5 5s-3 5-5 5-5-2-5-5 3-5 5-5z' fill='%2310b981' fill-opacity='0.03'/%3E%3C/svg%3E");
        }

        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--p506-accent); }
    </style>
</head>
<body class="antialiased text-slate-200">

    <nav class="bg-[#050a09]/80 backdrop-blur-2xl border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between py-4 px-8 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 border border-[#10b981]/30 rounded-full flex items-center justify-center bg-emerald-950/40">
                    <span class="serif-title text-sm text-[#10b981] font-bold">506</span>
                </div>
                <div>
                    <h1 class="serif-title text-xl text-white uppercase font-black leading-none">Punto 506</h1>
                    <p class="text-[#10b981] uppercase tracking-[0.3em] text-[7px] font-bold mt-1">Caribe Select Directory</p>
                </div>
            </div>

            <div class="flex items-center gap-6 overflow-x-auto hide-scroll pb-2 md:pb-0">
                <button data-cat="todos" class="filter-btn transition text-[9px] uppercase tracking-widest font-bold text-[#10b981] border-b border-[#10b981] pb-1">Todos</button>
                <button data-cat="salud" class="filter-btn transition text-[9px] uppercase tracking-widest font-medium text-gray-500 hover:text-white pb-1">Salud</button>
                <button data-cat="gastronomía" class="filter-btn transition text-[9px] uppercase tracking-widest font-medium text-gray-500 hover:text-white pb-1">Gastronomía</button>
                <button data-cat="estética" class="filter-btn transition text-[9px] uppercase tracking-widest font-medium text-gray-500 hover:text-white pb-1">Estética</button>
            </div>
        </div>
    </nav>

    <header class="relative py-20 tropical-pattern overflow-hidden">
        <div class="max-w-4xl mx-auto text-center px-6">
            <span class="text-[#10b981] text-[10px] tracking-[0.8em] uppercase font-semibold mb-6 block">Elegancia & Comunidad</span>
            <h2 class="serif-title text-2xl md:text-3xl text-white mb-6 leading-relaxed">CONECTANDO EL TALENTO DE <span class="text-emerald-400">POCOCÍ</span></h2>
            <p class="text-gray-400 text-sm md:text-base font-light italic max-w-2xl mx-auto mb-12 leading-loose">
                "Un ecosistema digital diseñado para elevar la visibilidad de los mejores servicios profesionales de nuestra zona."
            </p>
            
            <div class="max-w-md mx-auto">
                <input type="text" id="busqueda" placeholder="¿Qué estás buscando hoy?" class="search-input w-full py-4 px-8 text-xs tracking-widest text-white placeholder:text-gray-600 uppercase text-center">
            </div>
        </div>
    </header>
    
    <main class="max-w-7xl mx-auto py-12 px-8">
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-[#050a09]/95 backdrop-blur-xl">
        <div class="bg-[#0a1412] w-full max-w-3xl max-h-[85vh] overflow-y-auto rounded-[2rem] border border-white/10 relative custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-6 right-6 z-20 bg-black/40 hover:bg-emerald-500/20 rounded-full p-2 text-white transition">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-[#030706] py-16 px-8 border-t border-emerald-900/20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-xl text-white">PUNTO 506</h2>
                <p class="text-[8px] uppercase text-emerald-700 font-bold tracking-[0.4em]">Exclusividad Local</p>
            </div>
            <div class="text-center">
                <p class="text-[10px] text-gray-500 font-light tracking-widest uppercase">Un proyecto de <span class="text-white font-bold">MONTZU CR</span></p>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="text-emerald-800 text-center py-20 col-span-full uppercase text-[10px] tracking-widest font-black">Cargando Experiencias...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.style.opacity = '0';
            
            setTimeout(() => {
                grid.innerHTML = lista.map((n, i) => `
                    <div class="group glass-card rounded-[2rem] overflow-hidden animate-reveal" style="animation-delay: ${i * 0.1}s">
                        <div class="relative h-56 overflow-hidden">
                            <img src="${n.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="${n.nombre}">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0a1412] via-transparent"></div>
                            <div class="absolute bottom-4 left-6 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/30 text-[#10b981] text-[7px] px-3 py-1 font-bold tracking-widest rounded-full uppercase">${n.categoria}</div>
                        </div>
                        
                        <div class="p-8">
                            <h3 class="business-title text-lg text-white uppercase mb-3">${n.nombre}</h3>
                            <p class="text-gray-400 text-[10px] font-light uppercase tracking-wider line-clamp-2 mb-8 leading-relaxed">
                                ${n.servicios_resumen}
                            </p>
                            <button onclick="verDetalle(${n.id})" class="w-full py-3 border border-emerald-500/20 text-[#10b981] text-[9px] font-bold uppercase tracking-widest hover:bg-emerald-500 hover:text-black transition duration-300 rounded-xl">
                                Ver Catálogo
                            </button>
                        </div>
                    </div>
                `).join('');
                grid.style.opacity = '1';
            }, 300);
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-64 md:h-80">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0a1412] via-transparent"></div>
                </div>
                <div class="p-8 md:p-12 -mt-10 relative z-10 bg-[#0a1412] rounded-t-[3rem] animate-reveal">
                    <h2 class="serif-title text-3xl text-white mb-6 uppercase">${n.nombre}</h2>
                    <div class="space-y-6 mb-10">
                        <div class="bg-white/5 p-6 rounded-2xl border border-white/5">
                            <span class="text-emerald-500 text-[9px] font-bold uppercase tracking-widest mb-2 block">Descripción</span>
                            <p class="text-gray-300 text-sm leading-relaxed font-light italic">${n.descripcion || 'Especialista en servicios de alta calidad en Pococí.'}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                                <span class="text-gray-500 text-[8px] uppercase block mb-1">Horario</span>
                                <span class="text-white text-xs font-light">${n.horario}</span>
                            </div>
                            <div class="p-4 bg-white/5 rounded-xl border border-white/5">
                                <span class="text-gray-500 text-[8px] uppercase block mb-1">Ubicación</span>
                                <span class="text-white text-xs font-light">${n.direccion}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="flex-1 text-center py-4 bg-emerald-600 text-white text-[10px] font-bold uppercase tracking-widest rounded-xl hover:bg-emerald-500 transition">Contactar WhatsApp</a>
                        <a href="${n.instagram || '#'}" target="_blank" class="flex-1 text-center py-4 border border-white/10 text-white text-[10px] font-bold uppercase tracking-widest rounded-xl hover:bg-white/5 transition">Instagram</a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#10b981]', 'border-[#10b981]');
                        b.classList.add('text-gray-500');
                    });
                    btn.classList.add('text-[#10b981]', 'border-b', 'border-[#10b981]');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
