<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Directorio Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --p506-dark: #0d1117; --p506-gold: #c29d5b; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0d1117;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(194, 157, 91, 0.05) 0%, transparent 50%),
                linear-gradient(to bottom, #0d1117, #111827, #0d1117);
            background-attachment: fixed;
        }
        .serif-title { font-family: 'Cinzel', serif; letter-spacing: 0.1em; }
        .business-title { font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.2); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(194, 157, 91, 0.15);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-card:hover {
            border-color: var(--p506-gold);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .search-input {
            background: rgba(255,255,255,0.03);
            border: none;
            border-bottom: 1px solid rgba(194, 157, 91, 0.3);
            transition: all 0.4s ease;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.07);
            border-bottom: 1px solid var(--p506-gold);
            outline: none;
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c29d5b; }

        .tropical-header {
            background-image: url("data:image/svg+xml,%3Csvg width='84' height='48' viewBox='0 0 84 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0c5.37 3.5 14.78 5.08 24 0 10.34-5.7 18.41-5.66 24 0 4.8 4.85 12.41 4.96 24 0 5.42-2.33 8.33-1 12 0v48H0V0z' fill='%23c29d5b' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="antialiased text-slate-200">

    <nav class="bg-[#0d1117]/90 backdrop-blur-2xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between py-4 px-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 border border-[#c29d5b] rounded-full flex items-center justify-center bg-black/60 shadow-[0_0_15px_rgba(194,157,91,0.2)]">
                    <span class="serif-title text-xs text-[#c29d5b] font-bold">506</span>
                </div>
                <div class="hidden sm:block">
                    <h2 class="serif-title text-sm tracking-[0.2em] text-white uppercase font-black leading-none">Punto 506</h2>
                    <p class="text-[7px] text-[#c29d5b] tracking-[0.3em] uppercase font-bold">Pococí Select</p>
                </div>
            </div>

            <div class="flex items-center gap-6 overflow-x-auto hide-scroll px-4">
                <button data-cat="todos" class="filter-btn transition text-[9px] uppercase tracking-[0.2em] font-black text-[#c29d5b] border-b-2 border-[#c29d5b] pb-1 whitespace-nowrap">Todos</button>
                <button data-cat="salud" class="filter-btn transition text-[9px] uppercase tracking-[0.2em] font-bold text-gray-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Salud</button>
                <button data-cat="gastronomía" class="filter-btn transition text-[9px] uppercase tracking-[0.2em] font-bold text-gray-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Gastronomía</button>
                <button data-cat="estética" class="filter-btn transition text-[9px] uppercase tracking-[0.2em] font-bold text-gray-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Estética</button>
            </div>
        </div>
    </nav>

    <header class="relative py-20 px-6 tropical-header border-b border-white/5">
        <div class="max-w-4xl mx-auto text-center animate-fade-in">
            <h1 class="serif-title text-[#c29d5b] text-[10px] tracking-[0.6em] mb-6 uppercase font-bold">Nuestro Propósito</h1>
            <p class="text-white text-lg md:text-2xl font-light italic leading-relaxed mb-10">
                "Fortalecemos el comercio local en Pococí conectando a la comunidad con servicios profesionales de calidad, creando una red de crecimiento para nuestros negocios."
            </p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="busqueda" placeholder="¿Qué estás buscando hoy?" class="search-input w-full py-3 px-6 text-[11px] tracking-[0.1em] text-white placeholder:text-gray-500 uppercase">
            </div>
        </div>
    </header>
    
    <main class="max-w-7xl mx-auto py-16 px-6">
        <div class="flex items-center gap-4 mb-12">
            <div class="h-[1px] w-12 bg-[#c29d5b]/60"></div>
            <h2 class="serif-title text-xs text-white/80 uppercase tracking-[0.5em]">Directorio Comercial</h2>
        </div>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="bg-[#111827] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl border border-white/10 shadow-2xl relative animate-fade-in custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-6 right-6 z-20 bg-black/60 backdrop-blur-xl rounded-full p-3 text-white hover:bg-[#c29d5b] transition">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-black py-16 px-6 border-t border-white/10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-xl text-[#c29d5b] tracking-widest uppercase font-bold">Punto 506</h2>
                <p class="text-[8px] uppercase text-gray-500 font-bold tracking-[0.4em]">BY MONTZU CR</p>
            </div>
            <div class="text-center">
                <a href="https://wa.me/61928809" class="text-[10px] text-[#c29d5b] font-bold uppercase tracking-[0.2em] border border-[#c29d5b]/30 px-6 py-2 rounded-full hover:bg-[#c29d5b] hover:text-black transition">Inscribe tu negocio</a>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="text-gray-500 text-center py-20 col-span-full uppercase text-[10px] tracking-widest font-bold">Cargando directorio...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.innerHTML = lista.map((n, i) => `
                <div class="group glass-card rounded-2xl overflow-hidden animate-fade-in" style="animation-delay: ${i*0.05}s">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${n.imagen}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 group-hover:scale-110 transition duration-1000" alt="${n.nombre}">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0d1117] via-transparent opacity-90"></div>
                        <div class="absolute top-4 left-4 bg-[#c29d5b] text-black text-[7px] px-2 py-1 font-black tracking-[0.1em] rounded-md uppercase">${n.categoria}</div>
                    </div>
                    <div class="p-6 text-center">
                        <h3 class="business-title text-lg text-white mb-2 uppercase tracking-tight">${n.nombre}</h3>
                        <p class="text-gray-400 text-[10px] mb-6 font-light uppercase tracking-widest h-8 line-clamp-2">${n.servicios_resumen}</p>
                        <button onclick="verDetalle(${n.id})" class="w-full py-3 bg-[#c29d5b]/10 border border-[#c29d5b]/40 text-[#c29d5b] text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-[#c29d5b] hover:text-black transition duration-500 rounded">Ver Detalles</button>
                    </div>
                </div>
            `).join('');
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-72">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#111827] via-transparent"></div>
                </div>
                <div class="p-8 -mt-10 relative z-10 bg-[#111827] rounded-t-[2rem]">
                    <span class="text-[#c29d5b] text-[10px] font-bold tracking-[0.3em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-2xl text-white mt-4 mb-6 uppercase tracking-widest font-bold">${n.nombre}</h2>
                    <p class="text-gray-300 text-sm leading-relaxed mb-8 font-light italic border-l border-[#c29d5b] pl-4">${n.descripcion}</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <div class="bg-white/5 p-4 rounded-xl">
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-widest block mb-1">Horario</span>
                            <span class="text-gray-300 text-[11px]">${n.horario}</span>
                        </div>
                        <div class="bg-white/5 p-4 rounded-xl">
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-widest block mb-1">Ubicación</span>
                            <span class="text-gray-300 text-[11px]">${n.direccion}</span>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3">
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="w-full text-center py-4 bg-[#c29d5b] text-black text-[10px] font-black uppercase tracking-[0.2em] rounded-lg">WhatsApp</a>
                        <a href="${n.instagram || '#'}" target="_blank" class="w-full text-center py-4 border border-white/10 text-white text-[10px] font-bold uppercase tracking-[0.2em] rounded-lg">Instagram</a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                        b.classList.add('text-gray-400', 'border-transparent');
                    });
                    btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
