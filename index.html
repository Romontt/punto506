<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Pococí Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --p506-dark: #080c14; --p506-gold: #c29d5b; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #080c14;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(20, 40, 30, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(10, 30, 20, 0.4) 0%, transparent 50%),
                linear-gradient(to bottom, #080c14, #0a1a12, #080c14);
            background-attachment: fixed;
        }
        .serif-title { font-family: 'Cinzel', serif; letter-spacing: 0.1em; }
        .business-title { font-family: 'Montserrat', sans-serif; letter-spacing: -0.02em; }
        
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        /* Transición suave para el filtrado */
        #grid-negocios { transition: opacity 0.4s ease-in-out; }

        /* Estilo de Tarjetas con toque de resplandor constante */
        .glass-card {
            background: rgba(30, 41, 59, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(194, 157, 91, 0.08);
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-card:hover {
            border-color: var(--p506-gold);
            background: rgba(30, 41, 59, 0.4);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 15px rgba(194, 157, 91, 0.1);
        }

        /* Buscador Minimalista Estilo Boutique */
        .search-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 0;
            transition: all 0.4s ease;
        }
        .search-input:focus {
            border-bottom: 1px solid var(--p506-gold);
            padding-left: 1.5rem;
            box-shadow: none;
        }

        /* Primera tarjeta destacada (opcional, se activa en JS) */
        .featured-card {
            grid-column: span 2;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #080c14; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c29d5b; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        .tropical-header {
            background-color: #080c14;
            background-image: url("data:image/svg+xml,%3Csvg width='84' height='48' viewBox='0 0 84 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0c5.37 3.5 14.78 5.08 24 0 10.34-5.7 18.41-5.66 24 0 4.8 4.85 12.41 4.96 24 0 5.42-2.33 8.33-1 12 0v48H0V0z' fill='%23112a1d' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="antialiased text-slate-300">

    <header class="relative py-20 flex items-center justify-center text-white overflow-hidden border-b border-white/5 tropical-header">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#080c14]/60 to-[#080c14]"></div>
        
        <div class="relative z-10 text-center px-4 w-full max-w-4xl animate-fade-in">
            <div class="mb-6 flex justify-center">
                <div class="w-14 h-14 border border-[#c29d5b]/50 rounded-full flex items-center justify-center bg-black/40 backdrop-blur-md shadow-[0_0_30px_rgba(194,157,91,0.15)]">
                    <span class="serif-title text-xl text-[#c29d5b] font-bold">506</span>
                </div>
            </div>
            <h1 class="serif-title text-4xl md:text-5xl tracking-[0.5em] mb-2 text-white uppercase font-black">Punto 506</h1>
            <p class="text-[#c29d5b] uppercase tracking-[0.7em] text-[9px] md:text-[10px] font-bold mb-12 opacity-70">Descubre. Conecta. Destaca.</p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="busqueda" placeholder="BUSCAR EXPERIENCIA..." class="search-input w-full py-3 px-2 text-[10px] tracking-[0.3em] text-white placeholder:text-gray-600 focus:outline-none uppercase transition-all">
            </div>
        </div>
    </header>
    
    <nav class="bg-[#080c14]/95 backdrop-blur-xl border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-center md:justify-around items-center py-7 overflow-x-auto gap-12 px-6 hide-scroll">
            <button data-cat="todos" class="filter-btn transition text-[10px] uppercase tracking-[0.4em] font-black text-[#c29d5b] border-b-2 border-[#c29d5b] pb-2 whitespace-nowrap">Todos</button>
            <button data-cat="salud" class="filter-btn transition text-[10px] uppercase tracking-[0.4em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Salud</button>
            <button data-cat="gastronomía" class="filter-btn transition text-[10px] uppercase tracking-[0.4em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Gastronomía</button>
            <button data-cat="estética" class="filter-btn transition text-[10px] uppercase tracking-[0.4em] font-bold text-gray-500 pb-2 border-b-2 border-transparent hover:text-white whitespace-nowrap">Estética</button>
            <div class="hidden md:block h-4 w-[1px] bg-white/10"></div>
            <span class="hidden md:block text-[9px] uppercase tracking-[0.5em] font-black text-white/20">BY MONTZU CR</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-24 px-6">
        <div class="flex items-center gap-6 mb-20">
            <div class="h-[1px] w-16 bg-[#c29d5b]/50"></div>
            <h2 class="serif-title text-sm md:text-lg text-white/90 uppercase tracking-[0.6em]">Recomendaciones Select</h2>
        </div>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="bg-[#0f172a] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl border border-white/10 shadow-2xl relative animate-fade-in custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-6 right-6 z-20 bg-black/40 backdrop-blur-xl rounded-full p-2 text-white hover:bg-[#c29d5b] transition">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-black py-20 px-6 border-t border-white/5">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-2xl text-[#c29d5b] tracking-widest uppercase">Punto 506</h2>
                <p class="text-[9px] uppercase text-gray-600 font-bold tracking-[0.4em] mt-1">Pococí Select</p>
            </div>
            <p class="text-[11px] text-gray-500 font-light italic max-w-[320px] text-center leading-relaxed opacity-60">"Elevando el estándar de los servicios profesionales en la zona de Pococí."</p>
            <div class="text-center md:text-right">
                <p class="text-[8px] uppercase text-gray-600 mb-1 font-bold tracking-widest">Un proyecto de</p>
                <h3 class="serif-title text-sm text-white tracking-[0.4em]">MONTZU CR</h3>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="text-gray-500 text-center py-20 col-span-full uppercase text-[10px] tracking-widest font-bold">Iniciando Directorio...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.style.opacity = '0'; // Efecto suave de salida
            
            setTimeout(() => {
                grid.innerHTML = lista.map((n, i) => `
                    <div class="group glass-card rounded-2xl overflow-hidden animate-fade-in ${i === 0 && lista.length > 2 ? 'lg:col-span-2' : ''}" style="animation-delay: ${i*0.05}s">
                        <div class="relative ${i === 0 && lista.length > 2 ? 'h-80' : 'h-64'} overflow-hidden">
                            <img src="${n.imagen}" class="w-full h-full object-cover grayscale-[30%] group-hover:grayscale-0 group-hover:scale-110 transition duration-1000" alt="${n.nombre}">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#080c14] via-transparent opacity-90"></div>
                            <div class="absolute top-5 left-5 bg-[#c29d5b] text-black text-[7px] px-3 py-1 font-black tracking-[0.2em] rounded-full uppercase">${n.categoria}</div>
                        </div>
                        <div class="p-8 text-center">
                            <h3 class="business-title text-xl text-white mb-3 uppercase tracking-tight">${n.nombre}</h3>
                            <p class="text-gray-400 text-[10px] mb-8 font-light uppercase tracking-[0.2em] h-10 line-clamp-2 leading-relaxed opacity-80">${n.servicios_resumen}</p>
                            <button onclick="verDetalle(${n.id})" class="w-full py-4 border border-[#c29d5b]/30 text-[#c29d5b] text-[9px] font-bold uppercase tracking-[0.4em] hover:bg-[#c29d5b] hover:text-black transition duration-500">Explorar Detalles</button>
                        </div>
                    </div>
                `).join('');
                grid.style.opacity = '1'; // Efecto suave de entrada
            }, 300);
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-80">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0f172a] via-transparent"></div>
                </div>
                <div class="p-10 -mt-16 relative z-10 bg-[#0f172a] rounded-t-[3rem]">
                    <span class="text-[#c29d5b] text-[10px] font-bold tracking-[0.6em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-3xl text-white mt-4 mb-8 uppercase tracking-widest font-bold">${n.nombre}</h2>
                    
                    <div class="bg-white/[0.03] p-8 rounded-2xl mb-10 border border-white/5">
                         <h4 class="text-[9px] uppercase tracking-[0.4em] font-bold text-[#c29d5b] mb-4">Servicios Principales</h4>
                         <p class="text-gray-300 text-sm leading-relaxed font-light">${n.servicios_resumen}</p>
                    </div>

                    <p class="text-gray-400 text-sm leading-relaxed mb-12 font-light italic border-l border-[#c29d5b]/30 pl-8">
                        ${n.descripcion || 'Servicio de alta calidad seleccionado por Punto 506.'}
                    </p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 border-t border-white/5 pt-10 mb-12">
                        <div>
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-[0.4em] block mb-3">Horario</span>
                            <span class="text-gray-400 text-xs font-light">${n.horario}</span>
                        </div>
                        <div>
                            <span class="text-[#c29d5b] font-bold text-[9px] uppercase tracking-[0.4em] block mb-3">Ubicación</span>
                            <span class="text-gray-400 text-xs font-light">${n.direccion}</span>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-5 mb-12">
                        <a href="${n.instagram || '#'}" target="_blank" class="flex-1 text-center py-5 border border-white/10 text-white text-[10px] font-bold uppercase tracking-[0.3em] hover:bg-white hover:text-black transition duration-300 rounded-xl">Instagram</a>
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="flex-[1.5] text-center py-5 bg-[#c29d5b] text-black text-[10px] font-bold uppercase tracking-[0.3em] hover:bg-white transition duration-300 rounded-xl shadow-xl shadow-[#c29d5b]/5">WhatsApp Directo</a>
                    </div>

                    <div class="bg-black/20 p-10 rounded-3xl border border-dashed border-white/5 text-center">
                        <h4 class="text-[8px] font-black uppercase tracking-[0.5em] text-gray-600 mb-3">Buzón de Mejora Privado</h4>
                        <p class="text-[10px] text-gray-500 mb-8 italic font-light">¿Cómo puede este local mejorar su servicio?</p>
                        <a href="${prefilledLink}" target="_blank" class="text-[10px] font-bold text-[#c29d5b] uppercase tracking-[0.3em] border-b border-[#c29d5b]/30 pb-2 hover:text-white hover:border-white transition">Enviar Sugerencia</a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modal-negocio').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t) ||
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                        b.classList.add('text-gray-500', 'border-transparent');
                    });
                    btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
