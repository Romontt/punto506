<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS | Pococí Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --axis-blue: #0f172a; --axis-gold: #c29d5b; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a;
            background-image: linear-gradient(to bottom, rgba(248, 250, 252, 0.85), rgba(226, 232, 240, 0.85)), 
                              url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1600');
            background-attachment: fixed; background-size: cover; background-position: center;
        }
        .serif-title { font-family: 'Cinzel', serif; }
        .business-title { font-family: 'Montserrat', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #c29d5b; border-radius: 10px; }
    </style>
</head>
<body class="antialiased text-slate-900">

    <header class="relative py-12 flex items-center justify-center text-white overflow-hidden bg-slate-900 shadow-2xl">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&q=80&w=1600" class="absolute inset-0 w-full h-full object-cover opacity-60" alt="Montañas Pococí">
        <div class="absolute inset-0 bg-gradient-to-b from-[#0f172a]/80 via-[#0f172a]/60 to-[#0f172a]"></div>
        <div class="relative z-10 text-center px-4 w-full max-w-4xl">
            <div class="mb-4 flex justify-center">
                <div class="w-12 h-12 border border-[#c29d5b] rounded flex items-center justify-center bg-slate-900/60 backdrop-blur-sm rotate-45 shadow-lg">
                    <span class="serif-title text-xl text-[#c29d5b] -rotate-45 font-bold italic">A</span>
                </div>
            </div>
            <h1 class="serif-title text-3xl md:text-4xl tracking-[0.3em] mb-1 text-white uppercase font-bold">Axis</h1>
            <p class="text-[#c29d5b] uppercase tracking-[0.25em] text-[9px] md:text-[10px] font-semibold mb-6">Descubre. Conecta. Destaca.</p>
            <div class="max-w-md mx-auto relative group">
                <input type="text" id="busqueda" placeholder="Busca una experiencia en Guápiles..." class="w-full py-2.5 px-6 rounded-full bg-white/10 border border-white/20 backdrop-blur-md text-xs text-white placeholder:text-gray-400 focus:outline-none focus:border-[#c29d5b] focus:ring-1 focus:ring-[#c29d5b] transition-all duration-300">
            </div>
        </div>
    </header>
    
    <nav class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-5 overflow-x-auto gap-8 px-4">
            <button data-cat="todos" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-bold text-[#c29d5b] border-b-2 border-[#c29d5b] pb-1">Todos</button>
            <button data-cat="salud" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Salud</button>
            <button data-cat="gastronomía" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Gastronomía</button>
            <button data-cat="estética" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Estética</button>
            <div class="h-6 w-[1px] bg-slate-200 hidden md:block"></div>
            <button class="text-[11px] md:text-xs uppercase tracking-[0.3em] font-black text-slate-900 pb-1 cursor-default uppercase">BY MONTZU CR</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-16 px-6">
        <h2 class="serif-title text-2xl mb-10 text-slate-800 border-l-4 border-[#c29d5b] pl-5 uppercase tracking-widest">Experiencias Curadas</h2>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl shadow-2xl relative animate-fade-in custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 z-10 bg-white/80 backdrop-blur-md rounded-full p-2 text-slate-900 hover:bg-slate-200 transition shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-[#0f172a] text-white py-10 px-6 border-t border-[#c29d5b]/50 text-center md:text-left">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div>
                <h2 class="serif-title text-xl text-[#c29d5b] tracking-widest uppercase">Axis</h2>
                <p class="text-[9px] uppercase text-gray-500 font-medium">Pococí Select</p>
            </div>
            <p class="text-[11px] text-gray-400 font-light italic max-w-[280px] text-center">"Elevando el estándar de los servicios profesionales en la zona de Pococí."</p>
            <div class="md:text-right">
                <p class="text-[8px] uppercase text-gray-500 mb-1 font-bold">Un proyecto de</p>
                <h3 class="serif-title text-sm text-white tracking-[0.2em]">MONTZU CR</h3>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadAxisData() {
            try {
                const response = await fetch('negocios.json');
                if (!response.ok) throw new Error("No se pudo cargar el JSON");
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                console.error("Error cargando datos", e);
                document.getElementById('grid-negocios').innerHTML = '<p class="text-slate-500 italic col-span-full text-center py-20">Error al cargar los negocios. Revisa el archivo negocios.json.</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.innerHTML = lista.length === 0 ? '<p class="col-span-full text-center text-slate-500 py-20">Sin resultados.</p>' : 
            lista.map((n, i) => `
                <div class="group bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-500 border border-[#c29d5b]/10 hover:border-[#c29d5b]/40 animate-fade-in" style="animation-delay: ${i*0.05}s">
                    <div class="relative h-48 overflow-hidden">
                        <img src="${n.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="${n.nombre}">
                        <div class="absolute top-3 left-3 bg-[#0f172a]/95 text-[#c29d5b] text-[8px] px-2 py-1 font-bold tracking-widest rounded-sm uppercase">${n.categoria}</div>
                    </div>
                    <div class="p-6 text-center">
                        <h3 class="business-title text-base text-slate-900 mb-2 uppercase font-bold tracking-tight">${n.nombre}</h3>
                        <p class="text-slate-500 text-[10px] mb-6 font-medium uppercase tracking-wider h-8 overflow-hidden line-clamp-2 leading-tight">${n.servicios_resumen}</p>
                        <button onclick="verDetalle(${n.id})" class="w-full py-2.5 border border-[#c29d5b] text-[#c29d5b] text-[9px] font-bold uppercase tracking-widest hover:bg-[#c29d5b] hover:text-white transition duration-300 rounded-sm">Explorar Detalles</button>
                    </div>
                </div>
            `).join('');
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="relative h-48 overflow-hidden"> 
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"></div>
                </div>
                <div class="p-8 -mt-8 relative z-10 bg-white rounded-t-3xl">
                    <span class="text-[#c29d5b] text-[10px] font-bold tracking-[0.3em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-2xl text-slate-900 mt-2 mb-4 uppercase font-bold">${n.nombre}</h2>
                    
                    <div class="bg-slate-50 p-4 rounded-xl mb-6">
                         <h4 class="text-[10px] uppercase tracking-widest font-bold text-slate-400 mb-2">Servicios</h4>
                         <p class="text-slate-700 text-sm font-medium">${n.servicios_resumen}</p>
                    </div>

                    <p class="text-slate-600 text-sm leading-relaxed mb-8 font-light italic border-l-2 border-[#c29d5b]/30 pl-4">
                        ${n.descripcion}
                    </p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-slate-100 pt-6">
                        <div class="space-y-1">
                            <span class="text-[#c29d5b] font-bold text-[10px] uppercase tracking-widest block">Horario</span>
                            <span class="text-slate-500 text-xs">${n.horario}</span>
                        </div>
                        <div class="space-y-1">
                            <span class="text-[#c29d5b] font-bold text-[10px] uppercase tracking-widest block">Ubicación</span>
                            <span class="text-slate-500 text-xs">${n.direccion}</span>
                        </div>
                    </div>

                    <div class="mt-10 flex flex-col sm:flex-row gap-3">
                        <a href="${n.instagram || '#'}" target="_blank" class="flex-1 flex items-center justify-center gap-2 py-3.5 border-2 border-slate-900 text-slate-900 text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-slate-900 hover:text-white transition duration-300 rounded-xl">
                            Ver Instagram
                        </a>
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="flex-[1.5] flex items-center justify-center gap-2 py-3.5 bg-[#c29d5b] text-white text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-slate-900 transition duration-300 rounded-xl shadow-lg shadow-[#c29d5b]/20">
                            WhatsApp
                        </a>
                    </div>
                </div>
            `;
            
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onclick = (e) => { 
            if (e.target == document.getElementById('modal-negocio')) cerrarModal(); 
        }

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t) ||
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-bold');
                        b.classList.add('text-slate-600', 'border-transparent');
                    });
                    btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-bold');
                    
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadAxisData();
    </script>
</body>
</html>
