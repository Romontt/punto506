
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS | Pococí Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --axis-blue: #0f172a;
            --axis-gold: #c29d5b;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a;
            background-image: linear-gradient(to bottom, rgba(248, 250, 252, 0.85), rgba(226, 232, 240, 0.85)), 
                              url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1600');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }
        .serif-title { font-family: 'Cinzel', serif; }
        .business-title { font-family: 'Montserrat', sans-serif; }
        /* Animación suave para la aparición de tarjetas */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <header class="relative py-12 flex items-center justify-center text-white overflow-hidden bg-slate-900 shadow-2xl">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&q=80&w=1600" 
             class="absolute inset-0 w-full h-full object-cover opacity-60" alt="Montañas Pococí">
        
        <div class="absolute inset-0 bg-gradient-to-b from-[#0f172a]/80 via-[#0f172a]/60 to-[#0f172a]"></div>

        <div class="relative z-10 text-center px-4 w-full max-w-4xl">
            <div class="mb-4 flex justify-center">
                <div class="w-12 h-12 border border-[#c29d5b] rounded flex items-center justify-center bg-slate-900/60 backdrop-blur-sm rotate-45 shadow-lg">
                    <span class="serif-title text-xl text-[#c29d5b] -rotate-45 font-bold italic">A</span>
                </div>
            </div>
            <h1 class="serif-title text-3xl md:text-4xl tracking-[0.3em] mb-1 text-white uppercase">Axis</h1>
            <p class="text-[#c29d5b] uppercase tracking-[0.25em] text-[9px] md:text-[10px] font-semibold mb-6 opacity-95">Descubre. Conecta. Destaca.</p>
            
            <div class="max-w-md mx-auto relative group">
                <input type="text" id="busqueda" placeholder="Busca una experiencia en Guápiles..." 
                       class="w-full py-2.5 px-6 rounded-full bg-white/10 border border-white/20 backdrop-blur-md text-xs text-white placeholder:text-gray-400 focus:outline-none focus:border-[#c29d5b] focus:ring-1 focus:ring-[#c29d5b] transition-all duration-300">
                <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[#c29d5b]/80">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>
    
    <nav id="navbar" class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-around items-center py-5 overflow-x-auto gap-8 px-4">
            <button data-cat="todos" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-bold text-[#c29d5b] border-b-2 border-[#c29d5b] pb-1">Todos</button>
            <button data-cat="salud" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Salud</button>
            <button data-cat="gastronomía" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Gastronomía</button>
            <button data-cat="estética" class="filter-btn transition text-xs md:text-sm uppercase tracking-[0.2em] font-medium text-slate-600 pb-1 border-b-2 border-transparent hover:text-[#c29d5b]">Estética</button>
            <div class="h-6 w-[1px] bg-slate-200 hidden md:block"></div>
            <button class="transition text-[11px] md:text-xs uppercase tracking-[0.3em] font-black text-slate-900 pb-1">BY MONTZU CR</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-16 px-6">
        <h2 id="section-title" class="serif-title text-2xl mb-10 text-slate-800 border-l-4 border-[#c29d5b] pl-5 uppercase tracking-widest">Experiencias Curadas</h2>
        
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <footer class="bg-[#0f172a] text-white py-10 px-6 border-t border-[#c29d5b]/50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-xl text-[#c29d5b] tracking-widest uppercase">Axis</h2>
                <p class="text-[9px] tracking-[0.2em] uppercase text-gray-500 font-medium">Pococí Select</p>
            </div>
            <p class="text-[11px] text-gray-400 font-light italic max-w-[280px] text-center leading-relaxed px-4">"Elevando el estándar de los servicios profesionales en la zona de Pococí."</p>
            <div class="text-center md:text-right">
                <p class="text-[8px] tracking-[0.3em] uppercase text-gray-500 mb-1 font-bold">Un proyecto de</p>
                <h3 class="serif-title text-sm text-white tracking-[0.2em]">MONTZU CR</h3>
            </div>
        </div>
        <div class="mt-10 text-center text-[8px] text-gray-600 tracking-[0.4em] uppercase opacity-40">&copy; 2026 | All Rights Reserved</div>
    </footer>

    <script>
        let negociosRaw = []; // Guardará todos los datos del JSON

        async function loadAxisData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                console.error("Error cargando AXIS data:", e);
                document.getElementById('grid-negocios').innerHTML = '<p class="text-white">Error al cargar datos.</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            if (lista.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-500 italic py-20">No se encontraron resultados para tu búsqueda.</p>';
                return;
            }

            grid.innerHTML = lista.map((n, index) => `
                <div class="group bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-500 border border-[#c29d5b]/10 hover:border-[#c29d5b]/40 animate-fade-in" style="animation-delay: ${index * 0.05}s">
                    <div class="relative h-48 overflow-hidden"> 
                        <img src="${n.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="${n.nombre}">
                        <div class="absolute top-3 left-3 bg-[#0f172a]/95 backdrop-blur-md text-[#c29d5b] text-[8px] px-2 py-1 font-bold tracking-widest rounded-sm uppercase border border-[#c29d5b]/20">${n.categoria}</div>
                    </div>
                    <div class="p-6 text-center bg-gradient-to-b from-white to-slate-50"> 
                        <h3 class="business-title text-base text-slate-900 mb-2 uppercase tracking-tight">${n.nombre}</h3>
                        <p class="text-slate-500 text-[11px] mb-6 font-light leading-relaxed italic px-1 line-clamp-2">"${n.gancho}"</p>
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="inline-block w-full py-2.5 border border-[#c29d5b] text-[#c29d5b] text-[9px] font-bold uppercase tracking-widest hover:bg-[#c29d5b] hover:text-white transition duration-300 rounded-sm">Explorar Detalles</a>
                    </div>
                </div>
            `).join('');
        }

       function initFilters() {
    const searchInput = document.getElementById('busqueda');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Función auxiliar para quitar tildes y normalizar texto
    const normalizar = (texto) => {
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    };

    // Lógica del buscador mejorada
    searchInput.addEventListener('input', (e) => {
        const term = normalizar(e.target.value);
        
        const filtered = negociosRaw.filter(n => {
            const nombre = normalizar(n.nombre);
            const categoria = normalizar(n.categoria);
            const gancho = normalizar(n.gancho);
            
            return nombre.includes(term) || 
                   categoria.includes(term) ||
                   gancho.includes(term);
        });
        renderCards(filtered);
    });

    // Lógica de botones de categoría (se mantiene igual, ya que son clics directos)
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const cat = btn.getAttribute('data-cat');
            
            filterBtns.forEach(b => {
                b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-bold');
                b.classList.add('text-slate-600', 'border-transparent', 'font-medium');
            });
            btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-bold');
            btn.classList.remove('text-slate-600', 'border-transparent', 'font-medium');

            if (cat === 'todos') {
                renderCards(negociosRaw);
            } else {
                // También normalizamos aquí por si los datos del JSON varían en tildes
                const filtered = negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                renderCards(filtered);
            }
        });
    });
}
        loadAxisData();
    </script>
</body>
</html>
