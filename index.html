
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Guápiles Select</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --p506-gold: #c29d5b; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* Azul noche muy oscuro, casi negro */
            color: #f8fafc;
        }
        .serif-title { font-family: 'Playfair Display', serif; }
        
        /* Header ultra compacto */
        .header-mini {
            background: linear-gradient(to right, #0f172a, #1e293b, #0f172a);
            border-bottom: 1px solid rgba(194, 157, 91, 0.2);
        }

        .card-business {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-business:hover {
            transform: translateY(-8px);
            border-color: var(--p506-gold);
            background: rgba(30, 41, 59, 0.8);
        }

        .filter-btn {
            transition: all 0.3s ease;
            letter-spacing: 0.2em;
        }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--p506-gold); border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <header class="header-mini py-8 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="text-center md:text-left">
                <h1 class="serif-title text-3xl text-white tracking-tight">PUNTO <span class="text-[#c29d5b] italic">506</span></h1>
                <p class="text-[9px] uppercase tracking-[0.4em] text-gray-500 font-bold">Guápiles Select Directory</p>
            </div>
            
            <div class="w-full max-w-md relative">
                <input type="text" id="busqueda" placeholder="Buscar servicios premium..." class="w-full bg-white/5 border border-white/10 rounded-full py-2.5 px-6 text-sm focus:outline-none focus:border-[#c29d5b] transition-all">
                <div class="absolute right-4 top-2.5 text-[#c29d5b]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>
    </header>
    
    <nav class="bg-[#0f172a] border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-center gap-8 md:gap-16 py-5 overflow-x-auto no-scrollbar">
                <button data-cat="todos" class="filter-btn text-[11px] font-black uppercase text-[#c29d5b] border-b-2 border-[#c29d5b] pb-1">Todos</button>
                <button data-cat="salud" class="filter-btn text-[11px] font-bold uppercase text-gray-500 hover:text-white border-b-2 border-transparent pb-1">Salud</button>
                <button data-cat="gastronomía" class="filter-btn text-[11px] font-bold uppercase text-gray-500 hover:text-white border-b-2 border-transparent pb-1">Gastronomía</button>
                <button data-cat="estética" class="filter-btn text-[11px] font-bold uppercase text-gray-500 hover:text-white border-b-2 border-transparent pb-1">Estética</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-16 px-6">
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            </div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-xl border border-white/10 relative custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-5 right-5 z-20 text-white/50 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="py-12 px-6 border-t border-white/5 text-center bg-[#0a0f1d]">
        <p class="text-[10px] tracking-[0.5em] text-gray-600 uppercase font-black">Powered by MONTZU CR</p>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="col-span-full text-center py-20 text-gray-500 italic">Cargando experiencias...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.innerHTML = lista.map((n, i) => `
                <div class="card-business rounded-2xl overflow-hidden group cursor-pointer" onclick="verDetalle(${n.id})">
                    <div class="relative h-60 overflow-hidden">
                        <img src="${n.imagen}" class="w-full h-full object-cover transition duration-700 group-hover:scale-110" alt="${n.nombre}">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0f172a] via-transparent to-transparent opacity-60"></div>
                        <div class="absolute bottom-4 left-4">
                            <span class="bg-[#c29d5b] text-black text-[8px] px-2 py-0.5 font-black uppercase tracking-widest rounded-sm">${n.categoria}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="serif-title text-xl text-white mb-2">${n.nombre}</h3>
                        <p class="text-gray-400 text-[10px] uppercase tracking-widest line-clamp-2 leading-relaxed font-light">${n.servicios_resumen}</p>
                    </div>
                </div>
            `).join('');
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="h-64 relative">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1e293b]"></div>
                </div>
                <div class="p-10 -mt-12 relative z-10 text-center">
                    <span class="text-[#c29d5b] text-[10px] font-black tracking-[0.4em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-4xl text-white mt-2 mb-8">${n.nombre}</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 text-left">
                        <div class="bg-white/5 p-6 rounded-xl border border-white/5">
                            <h4 class="text-[9px] uppercase font-bold text-gray-500 mb-2 tracking-widest">Servicios</h4>
                            <p class="text-gray-300 text-sm leading-relaxed">${n.descripcion || n.servicios_resumen}</p>
                        </div>
                        <div class="space-y-4">
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <h4 class="text-[9px] uppercase font-bold text-[#c29d5b] mb-1 tracking-widest">Horario</h4>
                                <p class="text-gray-400 text-xs">${n.horario}</p>
                            </div>
                            <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                <h4 class="text-[9px] uppercase font-bold text-[#c29d5b] mb-1 tracking-widest">Ubicación</h4>
                                <p class="text-gray-400 text-xs">${n.direccion}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="w-full py-4 bg-[#c29d5b] text-black text-[11px] font-black uppercase tracking-[0.2em] rounded-full hover:brightness-110 transition">WhatsApp Directo</a>
                        <a href="${n.instagram || '#'}" target="_blank" class="w-full py-4 border border-white/20 text-white text-[11px] font-black uppercase tracking-[0.2em] rounded-full hover:bg-white/5 transition">Instagram Oficial</a>
                    </div>
                    
                    <div class="mt-10 pt-6 border-t border-white/5">
                        <a href="${prefilledLink}" target="_blank" class="text-[9px] font-bold text-gray-500 uppercase tracking-widest hover:text-[#c29d5b] transition">Buzón de Mejora Privado</a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t) ||
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                        b.classList.add('text-gray-500', 'border-transparent', 'font-bold');
                    });
                    btn.classList.add('text-[#c29d5b]', 'border-[#c29d5b]', 'font-black');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
