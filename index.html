<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Descubre. Conecta. Destaca.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Montserrat:wght@300;700&family=Baskervville:italic&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p506-dark: #050a09; 
            --p506-accent: #10b981; 
            --p506-gold: #c29d5b; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050a09;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                linear-gradient(to bottom, #050a09, #0a1f1a, #050a09);
            background-attachment: fixed;
        }

        /* TIPOGRAFÍA REFINADA */
        .serif-title { font-family: 'Cinzel', serif; letter-spacing: 0.2em; }
        .business-title { font-family: 'Montserrat', sans-serif; letter-spacing: 0.05em; font-weight: 700; }
        .elegant-italic { font-family: 'Baskervville', serif; font-style: italic; }

        /* ISOTIPO REFINADO (Efecto Medallón) */
        .iso-506 {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(16, 185, 129, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2), 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .iso-506::after {
            content: '';
            position: absolute;
            inset: 3px;
            border: 0.5px solid rgba(16, 185, 129, 0.2);
            border-radius: 50%;
        }

        /* ANIMACIONES Y CARDS */
        @keyframes revealCard { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-reveal { animation: revealCard 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-card:hover {
            border-color: var(--p506-accent);
            background: rgba(16, 185, 129, 0.04);
            transform: translateY(-5px);
        }

        .search-input {
            background: transparent;
            border-bottom: 1px solid rgba(16, 185, 129, 0.3);
            text-align: center;
            transition: all 0.5s ease;
        }
        .search-input:focus {
            border-bottom: 1px solid var(--p506-accent);
            outline: none;
            letter-spacing: 0.3em;
        }

        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        .tropical-header {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='20' viewBox='0 0 100 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M21.184 20c.357-.13.72-.264 1.088-.402l1.768-.661C33.64 15.347 39.647 14 50 14c10.271 0 15.362 1.222 24.629 4.928.955.383 1.869.74 2.75 1.072h6.225c-2.51-.73-5.139-1.691-8.233-2.928C65.888 13.278 60.562 12 50 12c-10.526 0-15.464 1.106-25.101 4.704-3.121 1.155-5.83 2.158-8.456 2.926l6.741.37z' fill='%2310b981' fill-opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="antialiased text-slate-200">

    <nav class="bg-[#050a09]/90 backdrop-blur-2xl border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between py-6 px-8 gap-6">
            <div class="flex items-center gap-5">
                <div class="iso-506">
                    <span class="serif-title text-[10px] text-[#10b981] font-bold mt-0.5">506</span>
                </div>
                <div class="text-left border-l border-white/10 pl-5">
                    <h1 class="serif-title text-xl md:text-2xl tracking-[0.3em] text-white font-normal leading-none">Punto 506</h1>
                    <p class="text-[#10b981] uppercase tracking-[0.5em] text-[7px] font-bold mt-2 opacity-80">Pococí Select Directory</p>
                </div>
            </div>

            <div class="flex items-center gap-8 overflow-x-auto hide-scroll w-full md:w-auto justify-center px-2">
                <button data-cat="todos" class="filter-btn transition text-[9px] uppercase tracking-[0.4em] font-bold text-[#10b981] border-b border-[#10b981] pb-1">Todos</button>
                <button data-cat="salud" class="filter-btn transition text-[9px] uppercase tracking-[0.4em] text-slate-400 pb-1 border-b border-transparent hover:text-white">Salud</button>
                <button data-cat="gastronomía" class="filter-btn transition text-[9px] uppercase tracking-[0.4em] text-slate-400 pb-1 border-b border-transparent hover:text-white">Gastronomía</button>
                <button data-cat="estética" class="filter-btn transition text-[9px] uppercase tracking-[0.4em] text-slate-400 pb-1 border-b border-transparent hover:text-white">Estética</button>
            </div>
        </div>
    </nav>

    <header class="relative py-20 tropical-header overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#050a09]/50 to-[#050a09]"></div>
        <div class="relative z-10 max-w-4xl mx-auto text-center px-6">
            <span class="serif-title text-[#10b981] text-[10px] tracking-[0.8em] mb-6 block uppercase opacity-70">Exclusividad Local</span>
            <p class="elegant-italic text-slate-300 text-lg md:text-xl leading-relaxed mb-10 max-w-2xl mx-auto opacity-90">
                "Un espacio curado para fortalecer el comercio en Pococí, conectando a la comunidad con los servicios más destacados de nuestra zona."
            </p>
            
            <div class="max-w-sm mx-auto">
                <input type="text" id="busqueda" placeholder="BÚSQUEDA SELECTA" class="search-input w-full py-3 text-[10px] tracking-[0.4em] text-white placeholder:text-slate-600 uppercase">
            </div>
        </div>
    </header>
    
    <main class="max-w-7xl mx-auto py-20 px-8">
        <div class="flex items-center justify-between mb-16">
            <div class="flex items-center gap-4">
                <div class="h-[1px] w-8 bg-[#10b981]"></div>
                <h2 class="serif-title text-[10px] text-white uppercase tracking-[0.6em]">Catálogo de Experiencias</h2>
            </div>
        </div>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/98 backdrop-blur-xl">
        <div class="bg-[#0a1412] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-none border border-white/5 shadow-2xl relative custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-8 right-8 z-20 text-white/50 hover:text-[#10b981] transition">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-[#030706] py-24 px-8 border-t border-white/5">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-16">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-xl text-white tracking-[0.4em] uppercase">Punto 506</h2>
                <p class="text-[8px] uppercase text-[#10b981] font-bold tracking-[0.5em] mt-3">Curaduría Comercial Pococí</p>
            </div>
            <div class="h-16 w-[1px] bg-white/5 hidden md:block"></div>
            <div class="text-center md:text-right">
                <p class="text-[8px] uppercase text-slate-500 mb-2 tracking-widest font-bold">Design & Strategy</p>
                <h3 class="serif-title text-xs text-white tracking-[0.5em]">MONTZU CR</h3>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="serif-title text-[9px] text-center py-20 col-span-full opacity-50 tracking-[0.5em]">CARGANDO DIRECTORIO...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.style.opacity = '0';
            setTimeout(() => {
                grid.innerHTML = lista.map((n, i) => `
                    <div class="group glass-card overflow-hidden animate-reveal" style="animation-delay: ${i * 0.1}s">
                        <div class="relative h-64 overflow-hidden">
                            <img src="${n.imagen}" class="w-full h-full object-cover grayscale-[30%] group-hover:grayscale-0 group-hover:scale-105 transition duration-[1.5s]" alt="${n.nombre}">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#050a09] via-transparent to-transparent"></div>
                        </div>
                        <div class="p-8 flex flex-col items-center text-center">
                            <span class="text-[#10b981] text-[7px] font-black tracking-[0.4em] uppercase mb-4">${n.categoria}</span>
                            <h3 class="business-title text-lg text-white mb-4 uppercase">${n.nombre}</h3>
                            <p class="elegant-italic text-slate-400 text-[13px] mb-8 leading-relaxed line-clamp-2">${n.servicios_resumen}</p>
                            <button onclick="verDetalle(${n.id})" class="text-[9px] uppercase tracking-[0.4em] text-white border-b border-white/20 pb-1 hover:border-[#10b981] hover:text-[#10b981] transition-all">Ver Portafolio</button>
                        </div>
                    </div>
                `).join('');
                grid.style.opacity = '1';
            }, 300);
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;
            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-80">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0a1412] to-transparent"></div>
                </div>
                <div class="p-10 md:p-16 -mt-20 relative z-10 bg-[#0a1412]">
                    <span class="text-[#10b981] text-[9px] font-bold tracking-[0.5em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-3xl text-white mt-6 mb-8 uppercase">${n.nombre}</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-12">
                        <div>
                            <h4 class="text-[8px] uppercase tracking-[0.3em] text-slate-500 mb-4 font-bold">Servicios Especializados</h4>
                            <p class="elegant-italic text-slate-200 text-base leading-relaxed">${n.servicios_resumen}</p>
                        </div>
                        <div class="space-y-6">
                            <div class="flex items-start gap-4">
                                <span class="text-[#10b981] text-[10px] font-bold tracking-tighter">LOC.</span>
                                <p class="text-slate-300 text-[11px] leading-relaxed uppercase tracking-widest">${n.direccion}</p>
                            </div>
                            <div class="flex items-start gap-4">
                                <span class="text-[#10b981] text-[10px] font-bold tracking-tighter">HRS.</span>
                                <p class="text-slate-300 text-[11px] uppercase tracking-widest">${n.horario}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 mb-16">
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="w-full text-center py-5 bg-white text-black text-[9px] font-black uppercase tracking-[0.3em] hover:bg-[#10b981] transition duration-500">Agendar Cita</a>
                        <a href="${n.instagram || '#'}" target="_blank" class="w-full text-center py-5 border border-white/10 text-white text-[9px] font-bold uppercase tracking-[0.3em] hover:bg-white/5 transition duration-500">Instagram</a>
                    </div>

                    <div class="border-t border-white/5 pt-10 text-center">
                        <p class="text-[9px] text-slate-500 mb-6 italic">¿Alguna sugerencia sobre este servicio?</p>
                        <a href="${prefilledLink}" target="_blank" class="text-[8px] font-bold text-[#10b981] uppercase tracking-[0.4em] hover:text-white transition-colors">Buzón de Mejora Anónimo →</a>
                    </div>
                </div>`;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() { document.getElementById('modal-negocio').classList.add('hidden'); document.body.style.overflow = 'auto'; }
        document.getElementById('modal-negocio').addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => normalizar(n.nombre).includes(t) || normalizar(n.servicios_resumen).includes(t) || normalizar(n.categoria).includes(t));
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#10b981]', 'border-[#10b981]');
                        b.classList.add('text-slate-400', 'border-transparent');
                    });
                    btn.classList.add('text-[#10b981]', 'border-[#10b981]');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }
        loadData();
    </script>
</body>
</html>
