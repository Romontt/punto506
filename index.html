<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNTO 506 | Descubre. Conecta. Destaca.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p506-dark: #050a09; 
            --p506-accent: #10b981; 
            --p506-gold: #c29d5b; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050a09;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                linear-gradient(to bottom, #050a09, #0a1f1a, #050a09);
            background-attachment: fixed;
        }
        .serif-title { font-family: 'Cinzel', serif; letter-spacing: 0.1em; }
        .business-title { font-family: 'Montserrat', sans-serif; letter-spacing: -0.01em; }
        
        @keyframes revealCard { 
            from { opacity: 0; transform: translateY(15px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        .animate-reveal { 
            opacity: 0;
            animation: revealCard 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; 
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }
        .glass-card:hover {
            border-color: var(--p506-accent);
            background: rgba(16, 185, 129, 0.06);
            transform: translateY(-5px);
        }

        .search-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 99px;
            transition: all 0.3s ease;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--p506-accent);
            outline: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #050a09; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        .tropical-header {
            background-image: url("data:image/svg+xml,%3Csvg width='84' height='48' viewBox='0 0 84 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0c5.37 3.5 14.78 5.08 24 0 10.34-5.7 18.41-5.66 24 0 4.8 4.85 12.41 4.96 24 0 5.42-2.33 8.33-1 12 0v48H0V0z' fill='%2310b981' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="antialiased text-slate-100">

    <nav class="bg-[#050a09]/90 backdrop-blur-2xl border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between py-4 px-6 gap-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 border-2 border-[#10b981] rounded-full flex items-center justify-center bg-black/40">
                    <span class="serif-title text-sm text-[#10b981] font-bold">506</span>
                </div>
                <div class="text-left">
                    <h1 class="serif-title text-xl tracking-[0.15em] text-white uppercase font-black leading-none">Punto 506</h1>
                    <p class="text-[#10b981] uppercase tracking-[0.3em] text-[9px] font-bold opacity-100 mt-1">Descubre. Conecta. Destaca.</p>
                </div>
            </div>

            <div class="flex items-center gap-6 overflow-x-auto hide-scroll w-full md:w-auto justify-center">
                <button data-cat="todos" class="filter-btn transition text-[10px] uppercase tracking-[0.2em] font-black text-[#10b981] border-b-2 border-[#10b981] pb-1 whitespace-nowrap">Todos</button>
                <button data-cat="salud" class="filter-btn transition text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Salud</button>
                <button data-cat="gastronomía" class="filter-btn transition text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Gastronomía</button>
                <button data-cat="estética" class="filter-btn transition text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400 pb-1 border-b-2 border-transparent hover:text-white whitespace-nowrap">Estética</button>
                <div class="hidden md:block h-4 w-[1px] bg-white/20"></div>
                <span class="hidden md:block text-[9px] uppercase tracking-[0.3em] font-bold text-white/40 whitespace-nowrap">BY MONTZU CR</span>
            </div>
        </div>
    </nav>

    <header class="relative py-12 md:py-20 tropical-header overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#050a09]"></div>
        <div class="relative z-10 max-w-3xl mx-auto text-center px-6">
            <h2 class="serif-title text-[#10b981] text-[10px] tracking-[0.5em] mb-6 uppercase font-bold">Nuestro Propósito</h2>
            <p class="text-slate-200 text-base md:text-lg font-light italic leading-relaxed mb-10">
                "Fortaleciendo el comercio local en Pococí a través de la conexión genuina con servicios profesionales de alta calidad."
            </p>
            
            <div class="max-w-md mx-auto relative">
                <input type="text" id="busqueda" placeholder="¿QUÉ ESTÁS BUSCANDO HOY?" class="search-input w-full py-3 px-6 text-[11px] tracking-[0.1em] text-white placeholder:text-slate-500 uppercase">
            </div>
        </div>
    </header>
    
    <main class="max-w-7xl mx-auto py-12 px-6">
        <div class="flex items-center gap-4 mb-10">
            <div class="h-[2px] w-10 bg-[#10b981]"></div>
            <h2 class="serif-title text-sm text-white uppercase tracking-[0.4em] font-semibold">Directorio Selecto</h2>
        </div>
        <div id="grid-negocios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <div id="modal-negocio" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg">
        <div class="bg-[#0c1a17] w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl border border-white/10 shadow-2xl relative custom-scroll">
            <button onclick="cerrarModal()" class="absolute top-5 right-5 z-20 bg-black/40 backdrop-blur-md rounded-full p-2 text-white hover:bg-[#10b981] transition-all">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-black/40 py-16 px-6 border-t border-white/5">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="text-center md:text-left">
                <h2 class="serif-title text-2xl text-[#10b981] tracking-widest uppercase">Punto 506</h2>
                <p class="text-[10px] uppercase text-emerald-700 font-bold tracking-[0.3em] mt-1">Excelencia en Pococí</p>
            </div>
            <div class="text-center md:text-right">
                <p class="text-[9px] uppercase text-slate-500 mb-1 font-bold tracking-widest">Desarrollado por</p>
                <h3 class="serif-title text-base text-white tracking-[0.3em]">MONTZU CR</h3>
            </div>
        </div>
    </footer>

    <script>
        let negociosRaw = [];
        const normalizar = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function loadData() {
            try {
                const response = await fetch('negocios.json');
                negociosRaw = await response.json();
                renderCards(negociosRaw);
                initFilters();
            } catch (e) { 
                document.getElementById('grid-negocios').innerHTML = '<p class="text-slate-400 text-center py-20 col-span-full uppercase text-[11px] tracking-widest font-bold">Cargando directorio...</p>';
            }
        }

        function renderCards(lista) {
            const grid = document.getElementById('grid-negocios');
            grid.style.opacity = '0';
            
            setTimeout(() => {
                grid.innerHTML = lista.map((n, i) => `
                    <div class="group glass-card rounded-2xl overflow-hidden animate-reveal" 
                         style="animation-delay: ${i * 0.05}s">
                        <div class="relative h-56 overflow-hidden">
                            <img src="${n.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" alt="${n.nombre}">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#050a09] via-transparent opacity-80"></div>
                            <div class="absolute top-4 left-4 bg-[#10b981] text-black text-[9px] px-3 py-1 font-black tracking-wider rounded-full uppercase">${n.categoria}</div>
                        </div>
                        
                        <div class="p-6 text-center flex flex-col flex-grow">
                            <h3 class="business-title text-lg text-white uppercase tracking-wide mb-3">${n.nombre}</h3>
                            <p class="text-slate-300 text-[12px] font-light leading-relaxed mb-6 line-clamp-2">
                                ${n.servicios_resumen}
                            </p>
                            <button onclick="verDetalle(${n.id})" class="mt-auto w-full py-3 bg-[#10b981]/10 border border-[#10b981]/30 text-[#10b981] text-[10px] font-bold uppercase tracking-widest hover:bg-[#10b981] hover:text-black transition-all rounded-lg">
                                Ver Detalles
                            </button>
                        </div>
                    </div>
                `).join('');
                grid.style.opacity = '1';
            }, 200);
        }

        function verDetalle(id) {
            const n = negociosRaw.find(item => item.id === id);
            if (!n) return;

            const googleFormBase = "https://docs.google.com/forms/d/e/1FAIpQLSfuSPB2ZQBl9COJLLgRMBkZ72aqlr-bVO-Pb0c0H7UvS801hQ/viewform";
            const prefilledLink = `${googleFormBase}?usp=pp_url&entry.2100078616=${encodeURIComponent(n.nombre)}`;

            document.getElementById('modal-content').innerHTML = `
                <div class="relative h-64">
                    <img src="${n.imagen}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0c1a17] via-transparent"></div>
                </div>
                <div class="p-8 md:p-10 -mt-12 relative z-10 bg-[#0c1a17] rounded-t-[2.5rem] animate-reveal">
                    <span class="text-[#10b981] text-[10px] font-bold tracking-[0.4em] uppercase">${n.categoria}</span>
                    <h2 class="serif-title text-3xl text-white mt-2 mb-8 uppercase tracking-wide font-bold border-b border-white/5 pb-4">${n.nombre}</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                        <div class="space-y-4">
                             <h4 class="text-[10px] uppercase tracking-widest font-black text-[#10b981]">Servicios Destacados</h4>
                             <p class="text-slate-200 text-sm leading-relaxed font-light">${n.servicios_resumen}</p>
                        </div>
                        <div class="flex flex-col gap-4 bg-white/5 p-5 rounded-2xl border border-white/5">
                            <div class="flex items-start gap-3">
                                <div class="text-[#10b981] mt-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                                <p class="text-slate-300 text-[12px] leading-snug uppercase tracking-wider">${n.horario}</p>
                            </div>
                            <div class="flex items-start gap-3">
                                <div class="text-[#10b981] mt-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                                <p class="text-slate-300 text-[12px] leading-snug uppercase tracking-wider">${n.direccion}</p>
                            </div>
                        </div>
                    </div>

                    <p class="text-slate-400 text-[13px] leading-relaxed mb-10 font-light italic border-l-2 border-[#10b981]/50 pl-6">
                        ${n.descripcion || 'Comprometidos con ofrecer una experiencia excepcional en cada visita.'}
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 mb-12">
                        <a href="https://wa.me/${n.whatsapp}" target="_blank" class="w-full text-center py-4 bg-[#10b981] text-black text-[11px] font-black uppercase tracking-widest hover:brightness-110 transition-all rounded-xl shadow-lg shadow-emerald-900/20">Contactar WhatsApp</a>
                        <a href="${n.instagram || '#'}" target="_blank" class="w-full text-center py-4 border border-white/20 text-white text-[11px] font-bold uppercase tracking-widest hover:bg-white/5 transition-all rounded-xl">Ver Instagram</a>
                    </div>

                    <div class="bg-white/[0.03] p-8 rounded-2xl border border-dashed border-white/10 text-center">
                        <h4 class="text-[10px] font-black uppercase tracking-widest text-[#10b981] mb-2">Canal de Mejora Directo</h4>
                        <p class="text-[11px] text-slate-400 mb-5 italic leading-relaxed">Tu opinión es anónima y fundamental para que el comercio de nuestra zona siga destacando.</p>
                        <a href="${prefilledLink}" target="_blank" class="inline-block text-[10px] font-bold text-[#c29d5b] uppercase tracking-[0.2em] border-b border-[#c29d5b]/40 pb-1 hover:text-white hover:border-white transition-all">
                            Enviar sugerencia anónima para ${n.nombre} →
                        </a>
                    </div>
                </div>
            `;
            document.getElementById('modal-negocio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-negocio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modal-negocio').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });

        function initFilters() {
            const input = document.getElementById('busqueda');
            input.addEventListener('input', (e) => {
                const t = normalizar(e.target.value);
                const filtrados = negociosRaw.filter(n => 
                    normalizar(n.nombre).includes(t) || 
                    normalizar(n.servicios_resumen).includes(t) ||
                    normalizar(n.categoria).includes(t)
                );
                renderCards(filtrados);
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cat = btn.getAttribute('data-cat');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('text-[#10b981]', 'border-[#10b981]', 'font-black');
                        b.classList.add('text-slate-400', 'border-transparent');
                    });
                    btn.classList.add('text-[#10b981]', 'border-[#10b981]', 'font-black');
                    const filtrados = cat === 'todos' ? negociosRaw : negociosRaw.filter(n => normalizar(n.categoria) === normalizar(cat));
                    renderCards(filtrados);
                });
            });
        }

        loadData();
    </script>
</body>
</html>
