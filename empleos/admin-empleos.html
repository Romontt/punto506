<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Punto 506</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .neon-border { border: 1px solid rgba(212, 163, 115, 0.2); transition: all 0.3s ease; }
        .neon-border:hover { border-color: #d4a373; box-shadow: 0 0 15px rgba(212, 163, 115, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, #d4a373 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#050505] text-white min-h-screen selection:bg-[#d4a373] selection:text-black">

    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-[#d4a373]/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-blue-500/5 rounded-full blur-[120px]"></div>
    </div>

    <nav class="border-b border-white/5 py-4 px-8 sticky top-0 glass z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-6">
                <a href="admin.html" class="flex items-center gap-2 group bg-white/5 px-4 py-2 rounded-full border border-white/10 hover:bg-white/10 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#d4a373]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Dashboard</span>
                </a>
                <div class="h-6 w-[1px] bg-white/10"></div>
                <h1 class="text-sm font-extrabold tracking-[0.2em] uppercase gradient-text">Control Center</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] uppercase tracking-tighter text-stone-400 font-bold">Admin Active</span>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <header class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
            <div>
                <span class="text-[#d4a373] text-[10px] font-black uppercase tracking-[0.4em] mb-2 block">Gestión de Talento</span>
                <h2 class="text-4xl md:text-5xl font-extrabold tracking-tighter">Solicitudes <span class="text-white/20 font-light">Pendientes</span></h2>
            </div>
            <div class="flex gap-4">
                <div class="bg-white/5 border border-white/10 px-6 py-3 rounded-2xl">
                    <p class="text-[9px] uppercase text-stone-500 font-bold mb-1">Total recibidos</p>
                    <p id="counter-total" class="text-xl font-bold">--</p>
                </div>
            </div>
        </header>

        <div class="flex gap-3 mb-8">
            <button onclick="cargarSolicitudes('todas')" class="px-5 py-2 rounded-full bg-[#d4a373] text-black text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all">Todas</button>
            <button onclick="cargarSolicitudes('pendientes')" class="px-5 py-2 rounded-full bg-white/5 border border-white/10 text-white text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Pendientes</button>
        </div>

        <div id="solicitudes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-32 text-center">
                <div class="inline-block w-8 h-8 border-2 border-[#d4a373]/20 border-t-[#d4a373] rounded-full animate-spin mb-4"></div>
                <p class="text-stone-500 uppercase tracking-[0.3em] text-[10px] font-bold">Sincronizando con Supabase...</p>
            </div>
        </div>
    </main>

    <script src="admin-empleos.js"></script>
</body>
</html>
