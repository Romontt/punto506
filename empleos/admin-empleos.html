<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Punto 506</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body class="bg-[#0f0c0b] text-stone-200 min-h-screen">

    <nav class="border-b border-[#d4a373]/10 py-6 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-6">
                <a href="admin.html" class="flex items-center gap-2 group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-stone-500 group-hover:text-[#d4a373] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span class="text-[9px] uppercase tracking-widest text-stone-500 group-hover:text-[#d4a373] transition-colors font-bold">Volver al Panel</span>
                </a>
                <div class="h-4 w-[1px] bg-white/10"></div>
                <h1 class="serif-title text-xl tracking-[0.2em] text-white uppercase font-normal">Panel de Control</h1>
            </div>
            <button onclick="cerrarSesion()" class="text-[9px] uppercase tracking-widest text-red-500 hover:text-white transition-colors">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <header class="mb-12">
            <h2 class="serif-title text-3xl text-white tracking-widest uppercase mb-2">Solicitudes de Empleo</h2>
            <p class="text-stone-500 text-sm italic">Gestione las vacantes enviadas por los comercios.</p>
        </header>

        <div id="solicitudes-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full py-20 text-center border border-white/5 bg-white/5 rounded-xl">
                <p class="text-stone-500 animate-pulse uppercase tracking-widest text-xs">Cargando solicitudes...</p>
            </div>
        </div>
    </main>

    <script src="admin-empleos.js"></script>
</body>
</html>
