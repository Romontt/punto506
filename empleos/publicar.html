
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Vacante | Punto 506</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body class="bg-[#0f0c0b] text-stone-200 min-h-screen">

    <nav class="border-b border-[#d4a373]/10 py-6 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-10 h-10 iso-emblem rounded-full flex items-center justify-center border border-[#d4a373]/30">
                    <span class="serif-title text-[9px] text-[#d4a373] font-bold">506</span>
                </div>
                <h1 class="serif-title text-xl tracking-[0.3em] text-white uppercase font-normal">Punto 506</h1>
            </div>
            <a href="index.html" class="text-[9px] uppercase tracking-widest text-stone-500 hover:text-[#d4a373]">Volver al inicio</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-16">
        <div class="bg-[#1c1614]/50 border border-white/5 p-8 md:p-12 rounded-xl backdrop-blur-md">
            <h2 class="serif-title text-2xl text-white tracking-widest uppercase mb-2">Publicar Vacante</h2>
            <p class="text-stone-400 text-sm mb-10 italic">Complete los detalles para que su puesto sea revisado por el equipo.</p>

            <form id="form-publicar" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-[0.3em] text-[#d4a373] mb-2 font-bold">Nombre del Comercio</label>
                    <input type="text" id="nombre_comercio" required 
                        class="w-full bg-[#0c0a09] border border-white/10 p-4 text-sm text-white focus:border-[#d4a373] outline-none transition-all"
                        placeholder="Ej: Restaurante El Sabor">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-[0.3em] text-[#d4a373] mb-2 font-bold">Puesto Disponible</label>
                    <input type="text" id="titulo_puesto" required 
                        class="w-full bg-[#0c0a09] border border-white/10 p-4 text-sm text-white focus:border-[#d4a373] outline-none transition-all"
                        placeholder="Ej: Administrador de Punto de Venta">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-[0.3em] text-[#d4a373] mb-2 font-bold">URL del Afiche / Imagen</label>
                    <input type="url" id="afiche_url" required 
                        class="w-full bg-[#0c0a09] border border-white/10 p-4 text-sm text-white focus:border-[#d4a373] outline-none transition-all"
                        placeholder="https://enlace-a-tu-imagen.jpg">
                    <p class="text-[9px] text-stone-500 mt-2 uppercase tracking-tighter">Sube tu imagen a la nube y pega el enlace directo aquí.</p>
                </div>

                <button type="submit" id="btn-enviar"
                    class="w-full bg-[#d4a373] text-[#130f0e] text-[10px] font-black uppercase tracking-[0.4em] py-5 hover:brightness-110 transition-all mt-4">
                    Enviar para Aprobación
                </button>
            </form>
            
            <div id="mensaje-exito" class="hidden mt-6 text-center p-4 border border-green-500/30 bg-green-500/10 rounded">
                <p class="text-green-400 text-[10px] uppercase tracking-widest font-bold">¡Publicación enviada con éxito! Será revisada pronto.</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="publicar.js"></script>
</body>
</html>
