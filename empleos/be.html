<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Empleo | Punto 506</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --gold: #d4a373;
            --dark: #0a0908;
        }
        
        body { 
            background: radial-gradient(circle at top center, #1c1917 0%, #0a0908 100%);
            font-family: 'Inter', sans-serif;
            color: #d1d5db;
        }

        .serif-title { 
            font-family: 'Cinzel', serif; 
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
        }

        .glass-card {
            background: rgba(28, 22, 20, 0.4);
            backdrop-blur: 12px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Animación de entrada */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal { animation: fadeUp 0.8s ease forwards; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <header class="max-w-7xl mx-auto mb-12 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <a href="/" class="serif-title text-[10px] text-[var(--gold)] hover:opacity-70 transition-opacity mb-2 block tracking-[0.4em]">
                ← Volver al inicio
            </a>
            <h1 class="serif-title text-3xl md:text-5xl text-white font-bold">Bolsa de <span class="text-[var(--gold)]">Empleo</span></h1>
            <p class="text-stone-500 text-[10px] uppercase tracking-[0.3em] mt-2">Conectando el talento de Pococí</p>
        </div>

        <div class="hidden md:block">
            <div class="px-6 py-3 border border-white/5 rounded-full bg-white/5 backdrop-blur-sm">
                <span class="text-[9px] uppercase tracking-widest text-stone-400">Vacantes Verificadas ✓</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <div id="grid-empleos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <footer class="max-w-7xl mx-auto mt-20 pt-10 border-t border-white/5 text-center">
        <p class="serif-title text-[8px] tracking-[0.4em] opacity-30">Punto 506 • Empleos • 2026</p>
    </footer>

    <script src="./script.js"></script>

</body>
</html>
