<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Empleo | Punto 506</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&family=Baskervville:italic&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../estilos.css"> 
    <style>
        /* Diferenciación visual: un fondo ligeramente más profundo */
        body { background-color: #0c0a09; }
        .job-card {
            background: rgba(28, 22, 20, 0.5);
            border: 1px solid rgba(212, 163, 115, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .job-card:hover {
            border-color: rgba(212, 163, 115, 0.4);
            transform: translateY(-4px);
            background: rgba(28, 22, 20, 0.8);
        }
    </style>
</head>
<body class="antialiased text-stone-200">

    <nav class="border-b border-[#d4a373]/10 py-6 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='../index.html'">
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 iso-emblem rounded-full flex items-center justify-center border border-[#d4a373]/30">
                        <span class="serif-title text-[9px] text-[#d4a373] font-bold">506</span>
                    </div>
                </div>
                <div class="h-8 w-[1px] bg-[#d4a373]/20"></div>
                <h1 class="serif-title text-xl tracking-[0.3em] text-white uppercase font-normal">Punto 506</h1>
            </div>

            <a href="publicar.html" class="text-[9px] font-black uppercase tracking-[0.2em] text-[#d4a373] hover:text-white transition-colors">
                + Publicar Vacante
            </a>
        </div>
    </nav>

    <header class="py-16 px-6">
        <div class="max-w-4xl mx-auto">
            <span class="block text-center text-[#d4a373] text-[10px] tracking-[0.5em] uppercase mb-4">Oportunidades</span>
            <h2 class="serif-title text-center text-4xl md:text-5xl text-white tracking-tighter mb-6">BOLSA DE <span class="text-[#d4a373]">EMPLEO</span></h2>
            <div class="h-[1px] w-12 bg-[#d4a373] mx-auto mb-8"></div>
            <p class="elegant-italic text-center text-stone-400 text-base max-w-xl mx-auto leading-relaxed">
                Encuentra tu lugar en el crecimiento comercial de Pococí.
            </p>
        </div>
    </header>

    <section class="max-w-2xl mx-auto px-6 mb-16">
        <div class="relative group">
            <input type="text" placeholder="¿Qué puesto buscas?" 
                class="w-full bg-[#1c1614]/50 border border-[#d4a373]/20 py-4 px-6 text-sm uppercase tracking-widest text-white placeholder:text-stone-600 focus:outline-none focus:border-[#d4a373] transition-all">
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#d4a373]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2"/></svg>
            </button>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="contenedor-empleos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-stone-600 text-[10px] uppercase tracking-[0.4em]">
                Cargando vacantes locales...
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-[#d4a373]/5 text-center">
        <p class="text-[8px] text-stone-600 uppercase tracking-[0.4em]">Un proyecto de MontZu CR &bull; 2026</p>
    </footer>

    <script src="empleos.js"></script>
</body>
</html>
