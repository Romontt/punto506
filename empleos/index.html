<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Empleo | Punto 506</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css"> 
</head>
<body class="bg-[#130f0e] text-white">

    <nav class="p-6 flex justify-between items-center border-bottom border-[rgba(212,163,115,0.1)]">
        <div class="brand-container">
            <div class="iso-emblem nav-logo-iso rounded-full">
                <span class="text-[10px] text-[#d4a373] font-bold">506</span>
            </div>
            <span class="nav-brand-name">PUNTO 506</span>
        </div>
        <a href="publicar.html" class="bg-[#d4a373] text-[#130f0e] px-4 py-2 rounded-lg text-[10px] font-black tracking-widest uppercase hover:scale-105 transition-all">
            + Publicar
        </a>
    </nav>

    <header class="header-texture text-center py-20">
        <h1 class="serif-title text-4xl md:text-5xl text-[#d4a373] animate-reveal">BOLSA DE EMPLEO</h1>
        <p class="elegant-italic text-stone-400 mt-4 opacity-80">Oportunidades que impulsan el talento local</p>
    </header>

    <main class="container mx-auto px-6 -mt-10">
        <div id="contenedor-empleos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 animate-pulse text-[#d4a373]">
                Buscando vacantes...
            </div>
        </div>
    </main>

    <footer class="header-texture mt-20 py-10 text-center">
        <p class="text-[9px] tracking-[0.3em] text-stone-500 uppercase">Punto 506 &copy; 2026 - Pococí, Costa Rica</p>
    </footer>

    <script src="../supabase.js"></script> <script src="empleos.js"></script>
</body>
</html>
