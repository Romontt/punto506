<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Empleo | Punto 506</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Montserrat:wght@700&family=Baskervville:italic&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../estilos.css"> <style>
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #130f0e; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d4a373; }
    </style>
</head>
<body class="antialiased text-stone-200 bg-[#130f0e]">

    <nav class="bg-[#130f0e]/95 backdrop-blur-2xl border-b border-[#5d1c15]/40 sticky top-0 z-50 w-full">
        <div class="w-full flex flex-col md:flex-row justify-between items-center py-4 px-6 md:px-12 border-b border-[#d4a373]/10">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='../index.html'">
                <div class="flex flex-col items-center gap-1">
                    <div class="w-10 h-10 iso-emblem rounded-full flex items-center justify-center border border-[#d4a373]/30">
                        <span class="serif-title text-[9px] text-[#d4a373] font-bold">506</span>
                    </div>
                    <span class="text-[#d4a373] text-[6px] tracking-[0.3em] font-black uppercase">BY MONTZU CR</span>
                </div>
                <div class="h-8 w-[1px] bg-[#d4a373]/20"></div>
                <div class="flex flex-col justify-center">
                    <h1 class="serif-title text-xl md:text-2xl tracking-[0.3em] text-white uppercase font-normal leading-none">Punto 506</h1>
                    <p class="text-[#d4a373]/60 uppercase tracking-[0.4em] text-[7px] font-bold mt-1">EMPLEOS</p>
                </div>
            </div>
            
            <a href="publicar.html" class="mt-4 md:mt-0 py-2 px-6 border border-[#d4a373] text-[#d4a373] text-[9px] font-black uppercase tracking-[0.3em] hover:bg-[#d4a373] hover:text-[#130f0e] transition-all duration-500">
                + Publicar Vacante
            </a>
        </div>
    </nav>

    <header class="relative py-16 md:py-24 header-texture border-b border-[#d4a373]/10 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#130f0e]"></div>
        <div class="relative z-10 max-w-4xl mx-auto text-center px-6">
            <div class="bg-[#130f0e]/60 backdrop-blur-sm p-6 md:p-10 rounded-sm border border-[#d4a373]/5 mb-10">
                <h2 class="serif-title text-[#d4a373] text-[12px] tracking-[0.6em] mb-4 uppercase font-bold">Talento Local</h2>
                <h1 class="serif-title text-3xl md:text-5xl text-white tracking-[0.2em] uppercase mb-4">Bolsa de Empleo</h1>
                <p class="elegant-italic text-stone-400 text-base md:text-lg leading-relaxed">
                    "Conectando el motor comercial de Pococí con los mejores profesionales de la zona."
                </p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-12 md:py-20 px-6">
        <div class="flex items-center gap-4 mb-12">
            <div class="h-[1px] w-10 bg-[#5d1c15]"></div>
            <h2 class="serif-title text-[10px] text-[#d4a373] uppercase tracking-[0.6em]">Oportunidades Disponibles</h2>
        </div>

        <div id="contenedor-empleos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-10">
            <div class="col-span-full text-center py-20">
                <div class="serif-title text-[10px] text-[#d4a373] animate-pulse uppercase tracking-[0.4em]">
                    Sincronizando vacantes...
                </div>
            </div>
        </div>
    </main>

    <footer class="header-texture border-t border-[#d4a373]/10 py-12">
        <div class="text-center">
            <div class="iso-emblem w-10 h-10 rounded-full mb-4 mx-auto flex items-center justify-center border border-[#d4a373]/30">
                <span class="serif-title text-[9px] text-[#d4a373] font-bold">506</span>
            </div>
            <p class="text-[8px] text-stone-600 uppercase tracking-[0.5em] font-medium">
                &copy; 2026 PUNTO 506 &bull; BOLSA DE EMPLEO LOCAL
            </p>
        </div>
    </footer>

    <script src="../app.js" type="module"></script> <script src="empleos.js"></script>
</body>
</html>
